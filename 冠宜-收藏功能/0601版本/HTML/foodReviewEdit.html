<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>撰寫美食心得 - 美食外送平台</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/foodReview.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="review-edit-container">
        <h2>撰寫美食心得</h2>
        <form id="reviewForm" class="review-form">
            <div class="form-group">
                <label for="storeName">店家名稱</label>
                <input type="text" id="storeName" name="storeName" required>
            </div>
            <div class="form-group">
                <label for="title">心得標題</label>
                <input type="text" id="title" name="title" required>
            </div>
            <div class="form-group">
                <label for="content">心得內容</label>
                <div id="editor"></div>
            </div>
            <div class="form-group">
                <label>評分</label>
                <div class="rating">
                    <span class="star" data-rating="1">★</span>
                    <span class="star" data-rating="2">★</span>
                    <span class="star" data-rating="3">★</span>
                    <span class="star" data-rating="4">★</span>
                    <span class="star" data-rating="5">★</span>
                </div>
            </div>
            <div class="form-group">
                <label>標籤</label>
                <div class="tags-container">
                    <input type="text" id="tagInput" placeholder="輸入標籤後按Enter">
                    <div id="tagsList" class="tags-list"></div>
                </div>
            </div>
            <div class="form-group">
                <label>上傳照片</label>
                <div class="image-upload">
                    <input type="file" id="imageUpload" multiple accept="image/*">
                    <div id="imagePreview" class="image-preview"></div>
                </div>
            </div>
            <div class="form-actions">
                <button type="button" class="btn-secondary" onclick="saveAsDraft()">儲存草稿</button>
                <button type="submit" class="btn-primary">發布心得</button>
            </div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script>
        $(function(){
            $("#nav-placeholder").load("nav.html");
        });
    </script>
    <script src="../JS/foodReviewEdit.js"></script>
</body>
</html>
