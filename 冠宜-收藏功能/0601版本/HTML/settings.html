<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人化設定 - 美食外送平台</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/settings.css">
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="settings-container">
        <h2>個人化設定</h2>
        <div class="settings-content">
            <div class="settings-section">
                <h3>基本資料</h3>
                <form id="profileForm" class="settings-form">
                    <div class="form-group">
                        <label for="name">姓名</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">電子郵件</label>
                        <input type="email" id="email" name="email" required readonly>
                    </div>
                    <div class="form-group">
                        <label for="phone">手機號碼</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                    <button type="submit" class="btn-primary">更新資料</button>
                </form>
            </div>

            <div class="settings-section">
                <h3>密碼設定</h3>
                <form id="passwordForm" class="settings-form">
                    <div class="form-group">
                        <label for="currentPassword">目前密碼</label>
                        <input type="password" id="currentPassword" name="currentPassword" required>
                    </div>
                    <div class="form-group">
                        <label for="newPassword">新密碼</label>
                        <input type="password" id="newPassword" name="newPassword" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">確認新密碼</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required>
                    </div>
                    <button type="submit" class="btn-primary">更新密碼</button>
                </form>
            </div>

            <div class="settings-section">
                <h3>通知設定</h3>
                <div class="settings-form">
                    <div class="form-group checkbox">
                        <input type="checkbox" id="orderNotifications" name="orderNotifications">
                        <label for="orderNotifications">訂單通知</label>
                    </div>
                    <div class="form-group checkbox">
                        <input type="checkbox" id="promotionNotifications" name="promotionNotifications">
                        <label for="promotionNotifications">優惠通知</label>
                    </div>
                    <div class="form-group checkbox">
                        <input type="checkbox" id="systemNotifications" name="systemNotifications">
                        <label for="systemNotifications">系統通知</label>
                    </div>
                    <button id="saveNotifications" class="btn-primary">儲存設定</button>
                </div>
            </div>

            <div class="settings-section">
                <h3>隱私設定</h3>
                <div class="settings-form">
                    <div class="form-group checkbox">
                        <input type="checkbox" id="showProfile" name="showProfile">
                        <label for="showProfile">公開個人資料</label>
                    </div>
                    <div class="form-group checkbox">
                        <input type="checkbox" id="showReviews" name="showReviews">
                        <label for="showReviews">公開我的心得</label>
                    </div>
                    <button id="savePrivacy" class="btn-primary">儲存設定</button>
                </div>
            </div>

            <div class="settings-section danger-zone">
                <h3>危險區域</h3>
                <div class="settings-form">
                    <button id="deleteAccount" class="btn-danger">刪除帳號</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(function(){
            $("#nav-placeholder").load("nav.html");
        });
    </script>
    <script src="../JS/settings.js"></script>
</body>
</html>
