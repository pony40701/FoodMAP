<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘記密碼 - 食力派ChowCrew</title>
    <link rel="stylesheet" href="../CSS/userForgotPassword.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="forgot-password-box">
            <div class="forgot-password-header">
                <h1>忘記密碼</h1>
                <p>請輸入您的電子郵件，我們將發送重設密碼的連結給您</p>
            </div>

            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="email">電子郵件</label>
                    <input type="email" id="email" name="email" placeholder="請輸入您的電子郵件" required>
                </div>
                <button type="submit" class="btn-submit">發送重設連結</button>
            </form>

            <div class="back-to-login">
                <a href="homePage.html">返回首頁</a>
            </div>
        </div>
    </div>

    <!-- 成功提示彈跳視窗 -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <i class="fas fa-check-circle success-icon"></i>
                <h2>發送成功</h2>
            </div>
            <div class="modal-body">
                <p>重設密碼的連結已發送到您的電子郵件</p>
                <p>請檢查您的收件匣</p>
            </div>
            <div class="modal-footer">
                <button onclick="closeModal()" class="btn-close">確定</button>
            </div>
        </div>
    </div>

    <script src="../JS/userForgotPassword.js"></script>
</body>
</html>
