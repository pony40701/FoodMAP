<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員註冊 - 食力派ChowCrew</title>
    <link rel="stylesheet" href="../CSS/userRegister.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="register-box">
            <div class="register-header">
                <h1>會員註冊</h1>
                <p>歡迎加入食力派ChowCrew，請填寫以下資料</p>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="email">電子郵件</label>
                    <input type="email" id="email" name="email" placeholder="請輸入電子郵件" required>
                    <div class="error-message"></div>
                </div>
                <div class="form-group">
                    <label for="password">密碼</label>
                    <div class="password-input-container">
                        <input type="password" id="password" name="password" placeholder="請輸入密碼" required>
                        <button type="button" class="toggle-password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="error-message"></div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">確認密碼</label>
                    <div class="password-input-container">
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="請再次輸入密碼" required>
                        <button type="button" class="toggle-password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="error-message"></div>
                </div>
                <div class="form-group">
                    <label for="name">姓名</label>
                    <input type="text" id="name" name="name" placeholder="請輸入姓名" required>
                    <div class="error-message"></div>
                </div>
                <div class="form-group">
                    <label for="phone">手機號碼</label>
                    <input type="tel" id="phone" name="phone" placeholder="請輸入手機號碼" required>
                    <div class="error-message"></div>
                </div>
                <div class="terms-checkbox">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">我已閱讀並同意<a href="#">服務條款</a>和<a href="#">隱私權政策</a></label>
                </div>
                <button type="submit" class="btn-register">註冊</button>
            </form>

            <div class="login-link">
                <p>已經有帳號了？<a href="#" id="showLoginModal">立即登入</a></p>
            </div>
        </div>
    </div>

    <!-- 登入彈跳視窗 -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>登入</h2>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label for="loginEmail">電子郵件</label>
                        <input type="email" id="loginEmail" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">密碼</label>
                        <input type="password" id="loginPassword" name="password" required>
                    </div>
                    <button type="submit" class="btn-primary">登入</button>
                </form>
                <div class="form-footer">
                    <a href="userForgotPassword.html">忘記密碼？</a>
                </div>
                <div class="social-login">
                    <p>或使用以下方式登入</p>
                    <div class="social-buttons">
                        <button class="social-btn google" onclick="socialLogin('google')">
                            <i class="fab fa-google"></i> Google
                        </button>
                        <button class="social-btn facebook" onclick="socialLogin('facebook')">
                            <i class="fab fa-facebook-f"></i> Facebook
                        </button>
                        <button class="social-btn line" onclick="socialLogin('line')">
                            <i class="fab fa-line"></i> Line
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../JS/userRegister.js"></script>
</body>
</html>
