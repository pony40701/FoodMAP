<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>店家資訊 - 食力派ChowCrew</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link rel="stylesheet" href="/CSS/storeDetail.css" />
</head>
<body>
  <!-- 導覽列 -->
  <nav class="navbar">
    <div class="navbar-left">
      <a href="/HTML/homePage.html" class="logo-text">食力派ChowCrew</a>
    </div>
    <div class="navbar-right">
      <a href="/HTML/ranking.html" class="nav-link">排行榜</a>
      <a href="/HTML/storeList.html" class="nav-link">店家清單</a>
      <a href="#" class="nav-link" id="btn-user-center">用戶中心</a>
      <button class="btn-login">登入</button>
    </div>
  </nav>

  <!-- 店家資訊主區塊 -->
  <main class="store-detail-section">
    <div class="store-header">
      <img src="https://images.unsplash.com/photo-1569718212165-3a8278d5f624?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="店家圖片" class="store-image" id="store-image">
      <div class="store-info">
        <h1 class="store-name" id="store-name">老張牛肉麵</h1>
        <div class="store-rating" id="store-rating">★★★★☆ <span>4.5</span></div>
        <div class="store-address" id="store-address"><i class="fas fa-map-marker-alt"></i> 台北市大安區忠孝東路四段123號</div>
        <div class="store-status status-open" id="store-status">營業中</div>
        <div class="store-actions">
          <button class="action-btn" id="btn-favorite"><i class="fa fa-heart"></i> 收藏</button>
          <button class="action-btn" id="btn-share"><i class="fa fa-share-alt"></i> 分享</button>
          <button class="action-btn" id="btn-call"><i class="fa fa-phone"></i> 撥打電話</button>
          <button class="action-btn" id="btn-review"><i class="fa fa-pen"></i> 寫評論</button>
        </div>
      </div>
    </div>
    <div class="store-menu-section">
      <h2>菜單</h2>
      <ul class="menu-list" id="menu-list">
        <!-- 菜單由 JS 動態產生 -->
      </ul>
    </div>
    <div class="store-review-section">
      <h2>評論</h2>
      <div class="review-list" id="review-list">
        <!-- 評論由 JS 動態產生 -->
      </div>
    </div>
  </main>

  <!-- 頁尾 -->
  <footer class="footer">
    <div class="footer-container">
      <div class="footer-section">
        <h4>關於我們</h4>
        <p>食力派ChowCrew致力於提供最優質的美食推薦與評論平台，讓您輕鬆發現身邊的美味。</p>
        <div class="footer-links">
          <a href="#">服務條款</a>
          <a href="#">隱私政策</a>
        </div>
      </div>
      <div class="footer-section">
        <h4>快速連結</h4>
        <div class="footer-links">
          <a href="/HTML/merchantRegister.html">商家註冊</a>
          <a href="/HTML/ranking.html">排行榜</a>
          <a href="#">寫評論</a>
          <a href="#">幫助中心</a>
        </div>
      </div>
      <div class="footer-section">
        <h4>聯絡我們</h4>
        <p>📧 support@chowcrew.com</p>
        <p>📞 02-1234-5678</p>
        <div class="social-icons">
          <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
          <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
          <a href="#" aria-label="Line"><i class="fab fa-line"></i></a>
          <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      <p>© 2025 食力派ChowCrew. 版權所有 | 台灣美食推薦第一選擇</p>
    </div>
  </footer>
  <script src="/JS/storeDetail.js"></script>
</body>
</html>
