<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>店家清單 - 食力派ChowCrew</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link rel="stylesheet" href="/CSS/storeList.css" />
</head>
<body>
  <!-- 導覽列 -->
  <nav class="navbar">
    <div class="navbar-left">
      <a href="/HTML/homePage.html" class="logo-text">食力派ChowCrew</a>
    </div>
    <div class="navbar-right">
      <a href="/HTML/ranking.html" class="nav-link">排行榜</a>
      <a href="/HTML/storeList.html" class="nav-link active">店家清單</a>
      <a href="#" class="nav-link" id="btn-user-center">用戶中心</a>
      <button class="btn-login">登入</button>
    </div>
  </nav>

  <!-- 搜尋與篩選 -->
  <section class="search-filter-section">
    <input type="text" class="search-input" id="store-search" placeholder="搜尋店家名稱..." />
    <select id="type-filter">
      <option value="">全部類型</option>
      <option value="中式">中式</option>
      <option value="燒烤">燒烤</option>
      <option value="火鍋">火鍋</option>
      <option value="日式">日式</option>
      <option value="美式">美式</option>
      <option value="義式">義式</option>
      <option value="牛排">牛排</option>
      <option value="素食">素食</option>
    </select>
    <button class="search-btn" id="btn-search"><i class="fas fa-search"></i> 搜尋</button>
  </section>

  <!-- 店家卡片列表 -->
  <main class="store-list-section">
    <div class="store-list" id="store-list">
      <!-- 店家卡片由 JS 動態產生 -->
    </div>
  </main>

  <!-- 頁尾 -->
  <footer class="footer">
    <div class="footer-container">
      <div class="footer-section">
        <h4>關於我們</h4>
        <p>食力派ChowCrew致力於提供最優質的美食推薦與評論平台，讓您輕鬆發現身邊的美味。</p>
        <div class="footer-links">
          <a href="#">服務條款</a>
          <a href="#">隱私政策</a>
        </div>
      </div>
      <div class="footer-section">
        <h4>快速連結</h4>
        <div class="footer-links">
          <a href="/HTML/merchantRegister.html">商家註冊</a>
          <a href="/HTML/ranking.html">排行榜</a>
          <a href="#">寫評論</a>
          <a href="#">幫助中心</a>
        </div>
      </div>
      <div class="footer-section">
        <h4>聯絡我們</h4>
        <p>📧 support@chowcrew.com</p>
        <p>📞 02-1234-5678</p>
        <div class="social-icons">
          <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
          <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
          <a href="#" aria-label="Line"><i class="fab fa-line"></i></a>
          <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      <p>© 2025 食力派ChowCrew. 版權所有 | 台灣美食推薦第一選擇</p>
    </div>
  </footer>
  <script src="/JS/storeList.js"></script>
</body>
</html>
