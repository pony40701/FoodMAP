<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通知中心 - 美食外送平台</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/notifications.css">
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="notifications-container">
        <h2>通知中心</h2>
        <div class="notifications-header">
            <div class="notification-filters">
                <button class="filter-btn active" data-filter="all">全部</button>
                <button class="filter-btn" data-filter="order">訂單</button>
                <button class="filter-btn" data-filter="system">系統</button>
                <button class="filter-btn" data-filter="promotion">優惠</button>
            </div>
            <div class="notification-actions">
                <button id="markAllRead" class="btn-secondary">全部標為已讀</button>
                <button id="clearAll" class="btn-secondary">清除全部</button>
            </div>
        </div>

        <div class="notifications-list">
            <!-- 通知列表將由 JavaScript 動態載入 -->
        </div>

        <div class="pagination">
            <button id="prevPage" class="btn-secondary">上一頁</button>
            <span id="pageInfo">第 1 頁</span>
            <button id="nextPage" class="btn-secondary">下一頁</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(function(){
            $("#nav-placeholder").load("nav.html");
        });
    </script>
    <script src="../JS/notifications.js"></script>
</body>
</html>
