<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商家管理 - 食力派ChowCrew</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/CSS/merchantDashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- 側邊欄 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>商家管理</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-section="overview">
                    <i class="fas fa-chart-line"></i>
                    <span>總覽</span>
                </a>
                <a href="#" class="nav-item" data-section="menu">
                    <i class="fas fa-utensils"></i>
                    <span>菜單管理</span>
                </a>
                <a href="#" class="nav-item" data-section="orders">
                    <i class="fas fa-shopping-cart"></i>
                    <span>訂單管理</span>
                </a>
                <a href="#" class="nav-item" data-section="reviews">
                    <i class="fas fa-star"></i>
                    <span>評論管理</span>
                </a>
                <a href="#" class="nav-item" data-section="settings">
                    <i class="fas fa-cog"></i>
                    <span>設定</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>登出</span>
                </button>
            </div>
        </aside>

        <!-- 主要內容區域 -->
        <main class="main-content">
            <!-- 總覽區塊 -->
            <section id="overview" class="content-section active">
                <h2>總覽</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <i class="fas fa-users"></i>
                        <div class="stat-info">
                            <h3>今日訪客</h3>
                            <p>128</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-shopping-cart"></i>
                        <div class="stat-info">
                            <h3>今日訂單</h3>
                            <p>45</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-star"></i>
                        <div class="stat-info">
                            <h3>平均評分</h3>
                            <p>4.5</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <i class="fas fa-comments"></i>
                        <div class="stat-info">
                            <h3>新評論</h3>
                            <p>12</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 菜單管理區塊 -->
            <section id="menu" class="content-section">
                <h2>菜單管理</h2>
                <div class="menu-actions">
                    <button class="add-item-btn">
                        <i class="fas fa-plus"></i>
                        新增餐點
                    </button>
                </div>
                <div class="menu-list">
                    <!-- 菜單項目將由JavaScript動態生成 -->
                </div>
            </section>

            <!-- 訂單管理區塊 -->
            <section id="orders" class="content-section">
                <h2>訂單管理</h2>
                <div class="order-filters">
                    <select id="orderStatus">
                        <option value="all">全部訂單</option>
                        <option value="pending">待處理</option>
                        <option value="processing">處理中</option>
                        <option value="completed">已完成</option>
                        <option value="cancelled">已取消</option>
                    </select>
                </div>
                <div class="orders-list">
                    <!-- 訂單列表將由JavaScript動態生成 -->
                </div>
            </section>

            <!-- 評論管理區塊 -->
            <section id="reviews" class="content-section">
                <h2>評論管理</h2>
                <div class="review-filters">
                    <select id="reviewRating">
                        <option value="all">全部評分</option>
                        <option value="5">5星</option>
                        <option value="4">4星</option>
                        <option value="3">3星</option>
                        <option value="2">2星</option>
                        <option value="1">1星</option>
                    </select>
                </div>
                <div class="reviews-list">
                    <!-- 評論列表將由JavaScript動態生成 -->
                </div>
            </section>

            <!-- 設定區塊 -->
            <section id="settings" class="content-section">
                <h2>設定</h2>
                <form id="settingsForm" class="settings-form">
                    <div class="form-group">
                        <label for="storeName">店家名稱</label>
                        <input type="text" id="storeName" name="storeName" required>
                    </div>
                    <div class="form-group">
                        <label for="storeAddress">店家地址</label>
                        <input type="text" id="storeAddress" name="storeAddress" required>
                    </div>
                    <div class="form-group">
                        <label for="storePhone">聯絡電話</label>
                        <input type="tel" id="storePhone" name="storePhone" required>
                    </div>
                    <div class="form-group">
                        <label for="storeHours">營業時間</label>
                        <input type="text" id="storeHours" name="storeHours" placeholder="例：週一至週五 11:00-21:00" required>
                    </div>
                    <div class="form-group">
                        <label for="storeDescription">店家簡介</label>
                        <textarea id="storeDescription" name="storeDescription" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="save-btn">儲存設定</button>
                </form>
            </section>
        </main>
    </div>
    <script src="/JS/merchantDashboard.js"></script>
</body>
</html>
