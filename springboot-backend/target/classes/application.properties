# 資料庫連接設定
spring.datasource.url=jdbc:mysql://34.80.228.222:3306/foodmap_shrshengfake
spring.datasource.username=testuser
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 設定
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# 應用程式設定
server.port=8090
server.servlet.context-path=/api

# JWT 設定
jwt.secret=foodmap_jwt_secret_key_2023_secure_authentication_token
jwt.expiration=86400000

# CORS 設定
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.exposed-headers=Authorization
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# 日誌設定
logging.level.org.springframework=INFO
logging.level.com.foodmap=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=ERROR 