<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘記密碼 - 食力派ChowCrew</title>
    <link rel="stylesheet" href="css/userForgotPassword.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/navforaboutus.css">
	<link rel="stylesheet" href="css/login-modal.css">
    <style>
		.search-section {
			display: none !important;
		}
	</style>
</head>
<body>
    <!-- 導覽列 -->
	<div class="navbar">
		<div class="navbar-left">
			<a href="index.html" class="logo-text">食力派ChowCrew</a>
		</div>
		<div class="search-section">
			<div class="search-bar">
				<div class="input-container">
					<span class="input-icon">🍴</span>
					<input class="search-input" placeholder="找美食" />
				</div>
				<div class="search-divider"></div>
				<div class="input-container">
					<span class="input-icon">📍</span>
					<input class="search-input" placeholder="選擇地點" />
				</div>
				<!-- 搜尋按鈕 -->
				<button class="search-btn">
					<img src="images/search.png" alt="search" width="26" height="26" />
				</button>
			</div>
		</div>
		<div class="navbar-right">
			<div class="restaurant-dropdown">
				<a href="restaurantList.html" class="nav-link dropdown-toggle">
					<i class="fas fa-utensils"></i>
					<span>餐廳列表</span>
				</a>
			</div>
			<div class="restaurant-dropdown">
				<a href="ranking.html" class="nav-link dropdown-toggle">排行榜 <i class="fas fa-chevron-down"></i></a>
				<div class="restaurant-dropdown-content">
					<a href="ranking.html" class="dropdown-item">
						<i class="fas fa-trophy"></i>
						<span>綜合排行</span>
					</a>
					<a href="ranking.html#popular" class="dropdown-item">
						<i class="fas fa-fire"></i>
						<span>熱門排行</span>
					</a>
					<a href="ranking.html#new" class="dropdown-item">
						<i class="fas fa-store-alt"></i>
						<span>新進店家</span>
					</a>
				</div>
			</div>
			<div class="restaurant-dropdown">
				<a href="#" class="nav-link dropdown-toggle">食評 <i class="fas fa-chevron-down"></i></a>
				<div class="restaurant-dropdown-content">
					<a href="blogPost.html" class="dropdown-item">
						<i class="fas fa-pen-alt"></i>
						<span>寫食記</span>
					</a>
					<a href="experienceList.html" class="dropdown-item">
						<i class="fas fa-book-open"></i>
						<span>瀏覽心得</span>
					</a>
				</div>
			</div>
			<div class="restaurant-dropdown">
				<a href="#" class="nav-link dropdown-toggle active">商家專用 <i class="fas fa-chevron-down"></i></a>
				<div class="restaurant-dropdown-content">
					<a href="restaurant-signup.html" class="dropdown-item">
						<i class="fas fa-store"></i>
						<span>商家註冊</span>
					</a>
					<a href="#" class="dropdown-item" onclick="openRestaurantLoginModal()">
						<i class="fas fa-sign-in-alt"></i>
						<span>商家登入</span>
					</a>
				</div>
			</div>
			<!-- 未登入狀態 - 顯示登入按鈕 -->
			<div id="loginSection" class="login-section">
				<button class="btn-login" id="loginButton">登入</button>
			</div>
			
			<!-- 已登入狀態 - 顯示會員頭像 -->
			<div id="userSection" class="user-section" style="display: none;">
				<div class="user-avatar">
					<img src="images/TEST.jpg" alt="會員頭像" class="avatar-img">
					<div class="avatar-dropdown">
						<a href="usercenter.html" class="dropdown-item">
							<i class="fas fa-tachometer-alt"></i>
							<span>會員中心</span>
						</a>
						<a href="usercenter.html#favorites" class="dropdown-item">
							<i class="fas fa-heart"></i>
							<span>我的收藏</span>
						</a>
						<a href="usercenter.html#reviews" class="dropdown-item">
							<i class="fas fa-star"></i>
							<span>我的評論</span>
						</a>
						<a href="usercenter.html#orders" class="dropdown-item">
							<i class="fas fa-history"></i>
							<span>瀏覽紀錄</span>
						</a>
						<div class="dropdown-divider"></div>
						<a href="#" class="dropdown-item logout-item" onclick="logout()">
							<i class="fas fa-sign-out-alt"></i>
							<span>登出</span>
						</a>
					</div>
				</div>
			</div>
		</div>
		<button class="hamburger">
			<i class="fas fa-bars"></i>
		</button>
	</div>
    <div class="container">
        <div class="forgot-password-box">
            <div class="forgot-password-header">
                <h1>忘記密碼</h1>
                <p>請輸入您的電子郵件，我們將發送重設密碼的連結給您</p>
            </div>

            <!-- 步驟指示器 -->
            <div class="step-indicator">
                <div class="step active">
                    <div class="step-number">1</div>
                    <div class="step-label">驗證電子郵件</div>
                </div>
                <div class="step">
                    <div class="step-number">2</div>
                    <div class="step-label">重設密碼</div>
                </div>
                <div class="step">
                    <div class="step-number">3</div>
                    <div class="step-label">完成</div>
                </div>
            </div>

            <!-- 步驟內容 -->
            <div class="step-content" id="step1">
                <form id="verifyEmailForm">
                    <div class="form-group">
                        <label for="email">電子郵件</label>
                        <input type="email" id="email" name="email" placeholder="請輸入您的電子郵件" required>
                        <div class="error-message"></div>
                    </div>
                    <button type="submit" class="btn-submit">發送驗證碼</button>
                </form>
            </div>

            <div class="step-content" id="step2" style="display: none;">
                <form id="resetPasswordForm">
                    <div class="form-group">
                        <label for="verificationCode">驗證碼</label>
                        <input type="text" id="verificationCode" name="verificationCode" placeholder="請輸入 6 位數驗證碼" required>
                        <div class="error-message"></div>
                    </div>
                    <div class="form-group">
                        <label for="newPassword">新密碼</label>
                        <div class="password-input-container">
                            <input type="password" id="newPassword" name="newPassword" placeholder="請輸入新密碼" required>
                            <button type="button" class="toggle-password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="error-message"></div>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">確認密碼</label>
                        <div class="password-input-container">
                            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="請再次輸入新密碼" required>
                            <button type="button" class="toggle-password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="error-message"></div>
                    </div>
                    <div class="resend-code">
                        <button type="button" id="resendCode">重新發送驗證碼</button>
                    </div>
                    <button type="submit" class="btn-submit">重設密碼</button>
                </form>
            </div>

            <div class="step-content" id="step3" style="display: none;">
                <div class="success-message">
                    <i class="fas fa-check-circle"></i>
                    <h2>密碼重設成功</h2>
                    <p>您的密碼已經成功重設</p>
                    <p>請使用新密碼登入您的帳號</p>
                </div>
                <div class="back-to-login">
                    <a href="index.html?showLogin=1">返回首頁</a>
                </div>
            </div>
        </div>
    </div>

    <!-- 成功提示彈跳視窗 -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <i class="fas fa-check-circle success-icon"></i>
                <h2>發送成功</h2>
            </div>
            <div class="modal-body">
                <p>重設密碼的連結已發送到您的電子郵件</p>
                <p>請檢查您的收件匣</p>
            </div>
            <div class="modal-footer">
                <button onclick="closeModal()" class="btn-close">確定</button>
            </div>
        </div>
    </div>

    <script src="js/userForgotPassword.js"></script>
    <script src="js/config.js"></script>
	<script src="js/toast.js"></script>
	<script src="js/login.js"></script>
	<script>
		const hamburger = document.querySelector('.hamburger');
		const navRight = document.querySelector('.navbar-right');
		const hamburgerIcon = hamburger.querySelector('i');

		hamburger.addEventListener('click', () => {
			navRight.classList.toggle('active');
			hamburgerIcon.classList.toggle('fa-bars');
			hamburgerIcon.classList.toggle('fa-xmark');
		});
	</script>
</body>
</html>
