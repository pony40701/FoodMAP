    <div id="loginModal" class="modal">
        <div class="modal-content" style="padding: 0; max-width: 340px; margin: 15% auto;">
            <div style="position: relative; text-align: center; padding: 15px 15px 0;">

                <span class="close"

                <form id="loginForm" style="text-align: left; margin-bottom: 15px;">
                    <div style="margin-bottom: 10px;">

                    </div>
                    <div style="margin-bottom: 10px;">
                        <label for="password"
                            style="display: block; font-size: 14px; margin-bottom: 3px; color: #333;">密碼</label>
                        <input type="password" id="password" name="password" required

    <script>
      function handleWriteReview() {
        const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
        
        if (!isLoggedIn) {
          alert('請先登入會員');
          document.getElementById('loginModal').style.display = 'block';
          window.onLoginSuccess = function() {
            window.location.href = 'blogPost.html';
          };
        } else {
          window.location.href = 'blogPost.html';
        }
      }

      function openRestaurantLoginModal() {
        document.getElementById('restaurantLoginModal').style.display = 'block';
      }

      function closeRestaurantLoginModal() {
        document.getElementById('restaurantLoginModal').style.display = 'none';
      }

      document.addEventListener('DOMContentLoaded', function() {
        // 檢查登入狀態
        const isLoggedIn = localStorage.getItem('isLoggedIn');
        const user = JSON.parse(localStorage.getItem('user'));

        if (isLoggedIn === 'true' && user) {
            const loginSection = document.getElementById('loginSection');
            const userSection = document.getElementById('userSection');
            if (loginSection) loginSection.style.display = 'none';
            if (userSection) userSection.style.display = 'flex';

            const userAvatarImg = document.querySelector('#userSection .avatar-img');
            if (userAvatarImg && (user.image_url || user.avatar_url)) {
                userAvatarImg.src = user.image_url || user.avatar_url;
            }
        }

        // 初始化通知服務
        if (window.NotificationService && typeof window.NotificationService.initialize === 'function') {
            window.NotificationService.initialize();
        }
        
        if (sessionStorage.getItem('openRestaurantLogin') === 'true') {
          sessionStorage.removeItem('openRestaurantLogin');
          openRestaurantLoginModal();
        }

        const loginModal = document.getElementById('loginModal');
        if (loginModal) {
          const closeBtn = loginModal.querySelector('.close');
          if (closeBtn) {
            closeBtn.onclick = function() {
              loginModal.style.display = 'none';
            };
          }
        }

        const restaurantLoginModal = document.getElementById('restaurantLoginModal');
        if (restaurantLoginModal) {
          const closeBtn = restaurantLoginModal.querySelector('.close');
          if (closeBtn) {
            closeBtn.onclick = closeRestaurantLoginModal;
          }
          
          const restaurantLoginForm = document.getElementById('restaurantLoginForm');
          if (restaurantLoginForm) {
            restaurantLoginForm.addEventListener('submit', function(e) {
              e.preventDefault();
              
              const email = document.getElementById('restaurant-email').value;
              const password = document.getElementById('restaurant-password').value;
              const remember = document.getElementById('restaurant-remember').checked;
              
              alert('登入成功！');
              closeRestaurantLoginModal();
              window.location.href = 'restaurant.html';
            });
          }
        }

        window.onclick = function(event) {
          if (event.target === loginModal) {
            loginModal.style.display = 'none';
          }
          if (event.target === restaurantLoginModal) {
            closeRestaurantLoginModal();
          }
        };
      });

      function logout() {
          // 清除使用者登入資訊
          localStorage.removeItem('user');
          localStorage.removeItem('isLoggedIn');
          localStorage.removeItem('userId');
          localStorage.removeItem('token');

          // 切換 UI 狀態
          const loginSection = document.getElementById('loginSection');
          const userSection = document.getElementById('userSection');
          if (loginSection) loginSection.style.display = 'flex';
          if (userSection) userSection.style.display = 'none';

          alert('您已成功登出！');
          // 重新載入頁面以確保狀態完全更新
          window.location.reload();
      }

      const hamburger = document.querySelector('.hamburger');
      const navRight = document.querySelector('.navbar-right');
      const hamburgerIcon = hamburger.querySelector('i');

      hamburger.addEventListener('click', () => {
          navRight.classList.toggle('active');
          hamburgerIcon.classList.toggle('fa-bars');
          hamburgerIcon.classList.toggle('fa-xmark');
      });
    </script>
