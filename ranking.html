<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美食排行榜 - 食力派ChowCrew</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="css/navforaboutus.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/ranking.css">
    <style>
        .title-section {
            text-align: center;
            padding: 35px 0;
            margin-top: 100px;
            margin-bottom: 30px;
            position: relative;
            background-color: #fff;
            box-shadow: 0 2px 15px rgba(255, 107, 26, 0.1);
        }
        .title-section::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, #ff6b1a, #ff8c42);
        }
        .title-section::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, #ff6b1a, #ff8c42);
        }
        .title-section h1 {
            font-size: 2.2em;
            color: #333;
            margin-bottom: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .title-section h1::before,
        .title-section h1::after {
            content: '★';
            color: #ff6b1a;
            font-size: 0.7em;
        }
        .title-section p {
            font-size: 1.1em;
            color: #666;
            position: relative;
            display: inline-block;
            padding: 0 20px;
        }
        .title-section p::before,
        .title-section p::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 30px;
            height: 1px;
            background-color: #ff8c42;
        }
        .title-section p::before {
            left: -20px;
        }
        .title-section p::after {
            right: -20px;
        }

        .hamburger.active i {
            font-family: "Font Awesome 6 Free" !important;
            font-weight: 900 !important;
        }

        /* 登入視窗樣式 - 極簡版本 */
        .modal {
            display: none;
            position: fixed;
            z-index: 3000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.3s;
        }

        .modal-content {
            background-color: #fff;
            margin: 5% auto;
            border-radius: 12px;
            padding: 15px 15px 20px 15px;
            border: 1px solid rgba(255, 107, 26, 0.3);
            width: 90%;
            max-width: 340px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            animation: slideIn 0.3s;
            position: relative;
        }

        .modal-header {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .modal-header h2 {
            font-size: 20px;
            color: #ff6b1a;
            margin: 0;
            flex-grow: 1;
            text-align: center;
        }

        .close {
            color: #aaa;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
            position: absolute;
            right: 15px;
            top: 12px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .form-group label {
            font-size: 14px;
            color: #333;
            font-weight: 600;
        }

        .form-group input {
            padding: 9px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .btn-primary {
            background: #ff6b1a;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 0;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        .form-footer {
            margin-top: 10px;
            text-align: center;
            font-size: 13px;
        }

        .social-login {
            margin-top: 12px;
            text-align: center;
        }

        .social-login p {
            margin-bottom: 5px;
            color: #888;
            font-size: 13px;
        }

        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 8px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            border: none;
            border-radius: 6px;
            padding: 6px 0;
            width: 32%;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            background: #f5f5f5;
        }

        .social-btn.google {
            color: #db4437;
        }

        .social-btn.facebook {
            color: #1877f3;
        }

        .social-btn.line {
            color: #00c300;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideIn {
            from {
                transform: translateY(-40px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* 登入和用戶區塊樣式*/
        .login-section,
        .user-section {
            display: flex;
            align-items: center;
        }

        /* 商家頭像樣式 */
        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            overflow: visible;
            cursor: pointer;
            border: 2px solid #ff6b1a;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1001;
        }

        .user-avatar:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(255, 107, 26, 0.4);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        /* 頭像下拉選單樣式 */
        .avatar-dropdown {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <!-- 導航欄 -->
    <div class="navbar">
        <div class="navbar-left">
            <a href="index.html" class="logo-text">食力派ChowCrew</a>
        </div>
        <div class="search-section">
            <div class="search-bar">
                <div class="input-container">
                    <span class="input-icon">🍴</span>
                    <input class="search-input" placeholder="找美食" />
                </div>
                <div class="search-divider"></div>
                <div class="input-container">
                    <span class="input-icon">📍</span>
                    <input class="search-input" placeholder="選擇地點" />
                </div>
                <!-- 搜尋按鈕 -->
                <button class="search-btn">
                    <img src="images/search.png" alt="search" width="26" height="26" />
                </button>
            </div>
        </div>
        <div class="navbar-right">
            <div class="restaurant-dropdown">
                <a href="restaurantList.html" class="nav-link dropdown-toggle">
                    <i class="fas fa-utensils"></i>
                    <span>餐廳詳情</span>
                </a>
            </div>
            <div class="restaurant-dropdown">
                <a href="ranking.html" class="nav-link dropdown-toggle active">排行榜 <i class="fas fa-chevron-down"></i></a>
                <div class="restaurant-dropdown-content">
                    <a href="ranking.html" class="dropdown-item">
                        <i class="fas fa-trophy"></i>
                        <span>綜合排行</span>
                    </a>
                    <a href="ranking.html#popular" class="dropdown-item">
                        <i class="fas fa-fire"></i>
                        <span>人氣排行</span>
                    </a>
                    <a href="ranking.html#rating" class="dropdown-item">
                        <i class="fas fa-star"></i>
                        <span>評分排行</span>
                    </a>
                </div>
            </div>
            <div class="restaurant-dropdown">
                <a href="#" class="nav-link dropdown-toggle">食評 <i class="fas fa-chevron-down"></i></a>
                <div class="restaurant-dropdown-content">
                    <a href="blogPost.html" class="dropdown-item">
                        <i class="fas fa-pen-alt"></i>
                        <span>寫食記</span>
                    </a>
                    <a href="experienceList.html" class="dropdown-item">
                        <i class="fas fa-book-open"></i>
                        <span>瀏覽心得</span>
                    </a>
                </div>
            </div>
            <div class="restaurant-dropdown">
                <a href="#" class="nav-link dropdown-toggle">商家專用 <i class="fas fa-chevron-down"></i></a>
                <div class="restaurant-dropdown-content">
                    <a href="restaurant-signup.html" class="dropdown-item">
                        <i class="fas fa-store"></i>
                        <span>商家註冊</span>
                    </a>
                    <a href="#" class="dropdown-item" onclick="openRestaurantLoginModal()">
                        <i class="fas fa-sign-in-alt"></i>
                        <span>商家登入</span>
                    </a>
                </div>
            </div>
            <!-- 未登入狀態 - 顯示登入按鈕 -->
            <div id="loginSection" class="login-section">
                <button class="btn-login">登入</button>
            </div>
            
            <!-- 已登入狀態 - 顯示會員頭像 -->
            <div id="userSection" class="user-section" style="display: none;">
                <div class="user-avatar">
                    <img src="images/TEST.jpg" alt="會員頭像" class="avatar-img">
                    <div class="avatar-dropdown">
                        <a href="usercenter.html" class="dropdown-item">
                            <i class="fas fa-tachometer-alt"></i>
                            <span>會員中心</span>
                        </a>
                        <a href="usercenter.html#favorites" class="dropdown-item">
                            <i class="fas fa-heart"></i>
                            <span>我的收藏</span>
                        </a>
                        <a href="usercenter.html#reviews" class="dropdown-item">
                            <i class="fas fa-star"></i>
                            <span>我的評論</span>
                        </a>
                        <a href="usercenter.html#orders" class="dropdown-item">
                            <i class="fas fa-history"></i>
                            <span>瀏覽紀錄</span>
                        </a>
                        <div class="dropdown-divider"></div>
                        <a href="#" class="dropdown-item logout-item" onclick="logout()">
                            <i class="fas fa-sign-out-alt"></i>
                            <span>登出</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <button class="hamburger">
            <i class="fas fa-bars"></i>
        </button>
    </div>

    <!-- 標題區塊 -->
    <div class="title-section">
        <h1>美食排行榜</h1>
        <p>探索城市中最受歡迎的美食餐廳</p>
    </div>

    <div class="container">
        <div class="filter-section">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">綜合排行</button>
                <button class="filter-btn" data-filter="weekly">本周熱門</button>
                <button class="filter-btn" data-filter="new">新店推薦</button>
            </div>
        </div>
        <div class="container two-columns">
            <div class="column google-list">
                <h2 class="list-title">Google 商家檔案</h2>
                <div class="restaurant-list"></div>
            </div>
            <div class="column custom-list">
                <h2 class="list-title">食力派饕客回饋</h2>
                <div class="custom-restaurant-list"></div>
            </div>
        </div>
        <button class="load-more">載入更多</button>
    </div>

    <div class="modal" id="restaurantModal">
        <div class="modal-content">
            <button type="button" class="close">&times;</button>
            <div class="restaurant-detail">
                <!-- 詳細內容將通過 JavaScript 動態載入 -->
            </div>
        </div>
    </div>

    <!-- 登入彈出視窗 -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>登入</h2>
                <span class="close">&times;</span>
            </div>
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email">電子郵件</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">密碼</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn-primary">登入</button>
            </form>
            <div class="form-footer">
                <a href="userForgotPassword.html">忘記密碼</a> | <a href="userRegister.html">註冊新帳號</a>
            </div>
            <div class="social-login">
                <p>或使用以下方式登入</p>
                <div class="social-buttons">
                    <button onclick="socialLogin('google')" class="social-btn google">
                        <i class="fab fa-google"></i> Google
                    </button>
                    <button onclick="socialLogin('facebook')" class="social-btn facebook">
                        <i class="fab fa-facebook-f"></i> Facebook
                    </button>
                    <button onclick="socialLogin('line')" class="social-btn line">
                        <i class="fab fa-line"></i> Line
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 商家登入彈出視窗 -->
    <div id="restaurantLoginModal" class="modal">
        <div class="modal-content">
             <div class="modal-header">
                <h2>商家登入</h2>
                <span class="close">&times;</span>
            </div>
            <form id="restaurantLoginForm" class="login-form">
                <div class="form-group">
                    <label for="restaurant-email">電子郵件</label>
                    <input type="email" id="restaurant-email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="restaurant-password">密碼</label>
                    <input type="password" id="restaurant-password" name="password" required>
                </div>
                 <div style="display: flex; align-items: center; margin-bottom: 10px;">
                    <input type="checkbox" id="restaurant-remember" name="remember" style="margin-right: 6px; width: 14px; height: 14px; accent-color: #ff6b1a; cursor: pointer;">
                    <label for="restaurant-remember" style="font-size: 13px; font-weight: 400; color: #666; cursor: pointer;">記住我</label>
                </div>
                <button type="submit" class="btn-primary">登入</button>
            </form>
            <div class="form-footer">
                <a href="restaurant-forgot-password.html">忘記密碼</a> | <a href="restaurant-signup.html">商家註冊</a>
            </div>
        </div>
    </div>

    <script src="js/toast.js"></script>
    <script src="js/ranking.js"></script>
    <script src="js/loginModal.js"></script>
    <script src="js/favoriteSystem.js"></script>
    <script src="js/favoriteButton.js"></script>
    <script>
        // API 基礎路徑
        window.API_BASE_URL = window.API_BASE_URL || 'http://localhost:8080/api';

        const hamburger = document.querySelector('.hamburger');
        const navRight = document.querySelector('.navbar-right');
        const hamburgerIcon = hamburger.querySelector('i');

        hamburger.addEventListener('click', () => {
            navRight.classList.toggle('active');
            hamburgerIcon.classList.toggle('fa-bars');
            hamburgerIcon.classList.toggle('fa-xmark');
        });

        // 登入彈窗功能
        document.addEventListener('DOMContentLoaded', function() {
            // 新增：頁面載入時檢查登入狀態
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const user = JSON.parse(localStorage.getItem('user'));

            if (isLoggedIn === 'true' && user) {
                const loginSection = document.getElementById('loginSection');
                const userSection = document.getElementById('userSection');
                if (loginSection) loginSection.style.display = 'none';
                if (userSection) userSection.style.display = 'flex';

                const userAvatarImg = document.querySelector('#userSection .avatar-img');
                if (userAvatarImg && (user.image_url || user.avatar_url)) {
                    userAvatarImg.src = user.image_url || user.avatar_url;
                }
            }
            
            // 會員登入
            const loginModal = document.getElementById('loginModal');
            const loginBtns = document.querySelectorAll('.btn-login');
            const loginClose = loginModal.querySelector('.close');
            // 商家登入
            const restaurantLoginModal = document.getElementById('restaurantLoginModal');
            const restaurantLoginClose = restaurantLoginModal.querySelector('.close');

            // 開啟會員登入
            loginBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    loginModal.style.display = 'block';
                });
            });
            // 關閉會員登入
            loginClose.addEventListener('click', function() {
                loginModal.style.display = 'none';
            });
            window.addEventListener('click', function(event) {
                if (event.target === loginModal) {
                    loginModal.style.display = 'none';
                }
                if (event.target === restaurantLoginModal) {
                    restaurantLoginModal.style.display = 'none';
                }
            });
            // 開啟商家登入
            document.querySelectorAll('a.dropdown-item, a.nav-link').forEach(link => {
                if (link.textContent.includes('商家登入')) {
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        restaurantLoginModal.style.display = 'block';
                    });
                }
            });
            // 關閉商家登入
            restaurantLoginClose.addEventListener('click', function() {
                restaurantLoginModal.style.display = 'none';
            });

            // 會員登入表單送出（呼叫後端 API）
            const userLoginForm = document.getElementById('loginForm');
            if (userLoginForm) {
                userLoginForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    const email = userLoginForm.querySelector('#email').value;
                    const password = userLoginForm.querySelector('#password').value;
                    try {
                        const response = await fetch(`${window.API_BASE_URL}/auth/login`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Accept': 'application/json'
                            },
                            body: JSON.stringify({ email, password })
                        });
                        const data = await response.json();
                        if (response.ok) {
                            // 儲存用戶資料
                            localStorage.setItem('user', JSON.stringify(data));
                            localStorage.setItem('isLoggedIn', 'true');
                            localStorage.setItem('userId', data.id);
                            // 顯示會員頭像
                            const loginSection = document.getElementById('loginSection');
                            const userSection = document.getElementById('userSection');
                            if (loginSection) loginSection.style.display = 'none';
                            if (userSection) userSection.style.display = 'flex';
                            // 更新頭像
                            const userAvatarImg = document.querySelector('.avatar-img');
                            if (userAvatarImg && (data.image_url || data.avatar_url)) {
                                userAvatarImg.src = data.image_url || data.avatar_url;
                            }
                            loginModal.style.display = 'none';
                            alert('登入成功！');
                        } else {
                            alert(data.error || data.message || '登入失敗');
                        }
                    } catch (error) {
                        alert('登入失敗，請稍後再試');
                    }
                });
            }

            // 商家登入表單送出（呼叫後端 API）
            const restaurantLoginForm = document.getElementById('restaurantLoginForm');
            if (restaurantLoginForm) {
                restaurantLoginForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    const email = document.getElementById('restaurant-email').value;
                    const password = document.getElementById('restaurant-password').value;
                    try {
                        const response = await fetch(`${window.API_BASE_URL}/merchants/login`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ email, password })
                        });
                        if (response.ok) {
                            const result = await response.json();
                            localStorage.setItem('merchantToken', result.token);
                            localStorage.setItem('merchantEmail', result.email);
                            localStorage.setItem('restaurantId', result.restaurantId);
                            alert('商家登入成功！');
                            restaurantLoginModal.style.display = 'none';
                            window.location.href = 'restaurant.html';
                        } else {
                            const errorData = await response.json();
                            alert(errorData.message || '商家登入失敗');
                        }
                    } catch (error) {
                        alert('商家登入失敗，請稍後再試');
                    }
                });
            }

            // 社群登入按鈕（僅示意）
            window.socialLogin = function(type) {
                alert('使用 ' + type + ' 登入 (僅前端示意)');
                loginModal.style.display = 'none';
            }
        });

        function logout() {
            // 清除使用者登入資訊
            localStorage.removeItem('user');
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('userId'); // 如果有儲存 userId
            localStorage.removeItem('token'); // 如果有儲存 token

            // 切換 UI 狀態
            const loginSection = document.getElementById('loginSection');
            const userSection = document.getElementById('userSection');
            if (loginSection) loginSection.style.display = 'flex';
            if (userSection) userSection.style.display = 'none';

            alert('您已成功登出！');
            // 可以選擇重新載入頁面以確保狀態完全更新
            window.location.reload();
        }
    </script>
</body>
</html>
