<!DOCTYPE html>
<html lang="zh-TW">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>商家註冊 - 食力派ChowCrew</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
	<link rel="stylesheet" href="css/restaurant-signup.css" />
</head>

<body>
	<!-- 主要內容區域 -->
	<div class="content-section">
		<!-- 註冊表單容器 -->
		<div class="signup-container">
			<div class="signup-header">
				<h1>商家註冊</h1>
				<p>加入食力派ChowCrew，開啟您的美食事業</p>
			</div>

			<form class="signup-form" id="restaurant-signup-form" enctype="multipart/form-data">
				<!-- 基本資料區塊 -->
				<div class="form-section">
					<h2>基本資料</h2>
					<div class="form-group avatar-upload">
						<label>餐廳頭像</label>
						<div class="avatar-container">
							<div class="avatar-preview">
								<div class="avatar-placeholder">
									<i class="fas fa-camera"></i>
									<span>點擊上傳頭像</span>
								</div>
							</div>
							<input type="file" id="avatar-upload" name="avatar" accept="image/*" class="avatar-input" required>
						</div>
						<p class="avatar-hint">建議上傳正方形圖片，大小不超過 2MB</p>
					</div>

					<div class="form-group">
						<label for="restaurant-name">餐廳名稱</label>
						<div class="input-with-icon">
							<i class="fas fa-store"></i>
							<input type="text" id="restaurant-name" name="name" placeholder="請輸入餐廳名稱"
								required>
						</div>
					</div>

					<div class="form-group">
						<label for="email">電子郵件</label>
						<div class="input-with-icon">
							<i class="fas fa-envelope"></i>
							<input type="email" id="email" name="email" placeholder="請輸入電子郵件" required>
						</div>
					</div>

					<div class="form-group">
						<label for="phone">聯絡電話</label>
						<div class="input-with-icon">
							<i class="fas fa-phone"></i>
							<input type="tel" id="phone" name="phoneNumber" placeholder="請輸入聯絡電話" required>
						</div>
					</div>
				</div>

				<!-- 密碼設定區塊 -->
				<div class="form-section">
					<h2>密碼設定</h2>
					<div class="form-group">
						<label for="password">密碼</label>
						<div class="input-with-icon">
							<i class="fas fa-lock"></i>
							<input type="password" id="password" name="password" placeholder="請輸入密碼" required>
						</div>
					</div>

					<div class="form-group">
						<label for="confirm-password">確認密碼</label>
						<div class="input-with-icon">
							<i class="fas fa-lock"></i>
							<input type="password" id="confirm-password" name="confirm-password" placeholder="請再次輸入密碼"
								required>
						</div>
					</div>
				</div>

				<!-- 餐廳資訊區塊 -->
				<div class="form-section">
					<h2>餐廳資訊</h2>
					<div class="form-group">
						<label for="address">餐廳地址</label>
						<div class="input-with-icon">
							<i class="fas fa-map-marker-alt"></i>
							<input type="text" id="address" name="address" placeholder="請輸入餐廳地址" required>
						</div>
					</div>

					<div class="form-group">
						<label for="cuisine-type">料理類型</label>
						<div class="input-with-icon">
							<i class="fas fa-utensils"></i>
							<input type="text" name="cuisineType" placeholder="請輸入料理類型" required />
						</div>
					</div>

					<div class="form-group">
						<label for="business-hours">營業時間</label>
						<div class="input-with-icon">
							<i class="fas fa-clock"></i>
							<input type="text" id="business-hours" name="businessHours" placeholder="例：11:00-21:00"
								required>
						</div>
					</div>
				</div>

				<!-- 餐廳照片區塊 -->
				<div class="form-section">
					<h2>餐廳照片</h2>
					<div class="form-group">
						<label>上傳餐廳照片</label>
						<div class="photo-upload-area">
							<div class="photo-grid">
								<!-- 預設照片上傳按鈕 -->
								<div class="photo-item add-photo">
									<input type="file" id="photo-upload" name="photos" accept="image/*" multiple
										class="photo-input">
									<div class="add-photo-content">
										<i class="fas fa-plus"></i>
										<span>新增照片</span>
									</div>
								</div>
							</div>
							<p class="photo-hint">建議上傳清晰的照片，每張照片大小不超過 2MB</p>
						</div>
					</div>
				</div>

				<!-- 同意條款 -->
				<div class="form-group terms-group">
					<label class="checkbox-label">
						<input type="checkbox" id="terms" name="terms" required>
						<span>我已閱讀並同意<a href="#">服務條款</a>和<a href="#">隱私政策</a></span>
					</label>
				</div>

				<button type="submit" class="signup-button">註冊</button>

				<div class="login-link">
					已有帳號？<a href="#" onclick="redirectToHomePage()">立即登入</a>
				</div>
			</form>
		</div>
	</div>

	<script>
		// 測試 JavaScript 是否正確載入
		console.log('JavaScript 已載入');

		document.addEventListener('DOMContentLoaded', function () {
			console.log('DOM 已載入完成');

			// 頭像上傳功能
			const avatarInput = document.getElementById('avatar-upload');
			const avatarPreview = document.querySelector('.avatar-preview');

			if (avatarPreview && avatarInput) {
				avatarPreview.addEventListener('click', function (e) {
					e.preventDefault();
					e.stopPropagation();
					avatarInput.click();
				});

				avatarInput.addEventListener('change', function (e) {
					const file = e.target.files[0];
					if (file) {
						if (file.size > 2 * 1024 * 1024) {
							alert('檔案大小不能超過 2MB');
							return;
						}

						if (!file.type.startsWith('image/')) {
							alert('請上傳圖片檔案');
							return;
						}

						const reader = new FileReader();
						reader.onload = function (e) {
							const oldImage = avatarPreview.querySelector('img');
							if (oldImage) {
								oldImage.remove();
							}

							const img = document.createElement('img');
							img.src = e.target.result;
							avatarPreview.appendChild(img);
							avatarPreview.classList.add('has-image');
						};
						reader.readAsDataURL(file);
					}
				});
			}

			// 餐廳照片上傳功能
			const photoUpload = document.getElementById('photo-upload');
			const photoGrid = document.querySelector('.photo-grid');
			const addPhotoButton = document.querySelector('.add-photo');

			if (addPhotoButton) {
				addPhotoButton.addEventListener('click', function () {
					photoUpload.click();
				});
			}

			if (photoUpload) {
				photoUpload.addEventListener('change', function (e) {
					const files = e.target.files;
					for (let file of files) {
						if (file.type.startsWith('image/')) {
							if (file.size > 2 * 1024 * 1024) {
								alert('檔案大小不能超過 2MB');
								continue;
							}

							const reader = new FileReader();
							reader.onload = function (e) {
								const photoItem = document.createElement('div');
								photoItem.className = 'photo-item photo-preview';
								photoItem.innerHTML = `
                                    <img src="${e.target.result}" alt="餐廳照片">
                                    <button class="delete-photo">
                                        <i class="fas fa-times"></i>
                                    </button>
                                `;
								photoGrid.insertBefore(photoItem, photoGrid.firstElementChild);
							};
							reader.readAsDataURL(file);
						}
					}
					this.value = ''; // 清空 input 值，這樣可以重複選擇相同的檔案
				});
			}

			// 處理照片刪除
			photoGrid.addEventListener('click', function (e) {
				if (e.target.closest('.delete-photo')) {
					const photoItem = e.target.closest('.photo-item');
					if (photoItem) {
						photoItem.remove();
					}
				}
			});
		});

		// 重導向到首頁並開啟商家登入彈窗
		function redirectToHomePage() {
			// 儲存一個標記，表示要開啟商家登入彈窗
			sessionStorage.setItem('openRestaurantLogin', 'true');
			// 跳轉到首頁
			window.location.href = 'index.html';
		}
	</script>
	<script>
    document.getElementById('merchantForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const form = e.target;

      const formData = new FormData();

      // 拿 input 欄位值
      const jsonData = {
        name: form.name.value,
        email: form.email.value,
        password: form.password.value,
        confirmPassword: form.confirmPassword.value,
        phoneNumber: form.phoneNumber.value,
        address: form.address.value,
        cuisineType: form.cuisineType.value,
        businessHours: form.businessHours.value,
        avatarUrl: "",     // 後端處理圖片再設值
        imageUrls: []      // 同上
      };

      // 加入 JSON Blob
      const jsonBlob = new Blob([JSON.stringify(jsonData)], {
        type: 'application/json'
      });
      formData.append("data", jsonBlob);

      // 加入單張頭像圖片
      const avatarFile = form.avatar.files[0];
      if (avatarFile) {
        formData.append("avatar", avatarFile);
      }

      // 加入多張餐廳圖片
      const photoFiles = form.photos.files;
      for (let i = 0; i < photoFiles.length; i++) {
        formData.append("photos", photoFiles[i]);
      }

      try {
        const response = await fetch("http://localhost:8080/api/merchants/register", {
          method: "POST",
          body: formData
        });

        if (!response.ok) {
          const errorText = await response.text();
          alert("註冊失敗：" + errorText);
        } else {
          const result = await response.text();
          alert("註冊成功：" + result);
          form.reset(); // 清空表單
        }
      } catch (err) {
        console.error("發生錯誤", err);
        alert("請求失敗，請檢查後端或網路！");
      }
    });
  </script>
</body>

</html>
