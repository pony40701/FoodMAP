	<script>
		
		// 測試 JavaScript 是否正確載入
		('JavaScript 已載入');

		document.addEventListener('DOMContentLoaded', function () {
			('DOM 已載入完成');

			// 電子信箱檢查功能
			const emailInput = document.getElementById('email');
			let emailCheckTimeout;

			emailInput.addEventListener('input', function() {
				clearTimeout(emailCheckTimeout);
				const email = this.value;
				
				// 清除之前的提示訊息
				const existingMessage = document.querySelector('.email-message');
				if (existingMessage) {
					existingMessage.remove();
				}

				// 檢查是否為有效的電子信箱格式
				if (!email || !email.match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/)) {
					return;
				}

				// 設定延遲檢查，避免使用者輸入時頻繁發送請求
				emailCheckTimeout = setTimeout(async () => {
					try {
						const response = await fetch(`http://localhost:8080/api/merchants/check-email?email=${encodeURIComponent(email)}`);
						const exists = await response.json();

						const messageDiv = document.createElement('div');
						messageDiv.className = 'email-message';
						messageDiv.style.marginTop = '5px';
						messageDiv.style.fontSize = '14px';
						
						if (exists) {
							messageDiv.style.color = '#dc3545';
							messageDiv.textContent = '此電子信箱已被註冊';
							emailInput.setCustomValidity('此電子信箱已被註冊');
						} else {
							messageDiv.style.color = '#28a745';
							messageDiv.textContent = '此電子信箱可以使用';
							emailInput.setCustomValidity('');
						}
						
						// 將提示訊息插入到電子信箱輸入框後面
						emailInput.parentNode.parentNode.appendChild(messageDiv);
					} catch (error) {
						console.error('檢查電子信箱時發生錯誤:', error);
					}
				}, 500); // 500毫秒後執行檢查
			});

			// 頭像上傳功能
			const avatarInput = document.getElementById('avatar-upload');
			const avatarPreview = document.querySelector('.avatar-preview');

			if (avatarPreview && avatarInput) {
				avatarPreview.addEventListener('click', function (e) {
					e.preventDefault();
					e.stopPropagation();
					avatarInput.click();
				});

				avatarInput.addEventListener('change', function (e) {
					const file = e.target.files[0];
					if (file) {
						if (file.size > 2 * 1024 * 1024) {
							alert('檔案大小不能超過 2MB');
							return;
						}

						if (!file.type.startsWith('image/')) {
							alert('請上傳圖片檔案');
							return;
						}

						const reader = new FileReader();
						reader.onload = function (e) {
							const oldImage = avatarPreview.querySelector('img');
							if (oldImage) {
								oldImage.remove();
							}

							const img = document.createElement('img');
							img.src = e.target.result;
							avatarPreview.appendChild(img);
							avatarPreview.classList.add('has-image');
						};
						reader.readAsDataURL(file);
					}
				});
			}

			// 餐廳照片上傳功能
			const photoUpload = document.getElementById('photo-upload');
			const photoGrid = document.querySelector('.photo-grid');
			const addPhotoButton = document.querySelector('.add-photo');

			if (addPhotoButton) {
				addPhotoButton.addEventListener('click', function () {
					photoUpload.click();
				});
			}

			if (photoUpload) {
				photoUpload.addEventListener('change', function (e) {
					const files = e.target.files;
					for (let file of files) {
						if (file.type.startsWith('image/')) {
							if (file.size > 2 * 1024 * 1024) {
								alert('檔案大小不能超過 2MB');
								continue;
							}

							const reader = new FileReader();
							reader.onload = function (e) {
								const photoItem = document.createElement('div');
								photoItem.className = 'photo-item photo-preview';
								photoItem.innerHTML = `
                                    <img src="${e.target.result}" alt="餐廳照片">
                                    <button class="delete-photo">
                                        <i class="fas fa-times"></i>
                                    </button>
                                `;
								photoGrid.insertBefore(photoItem, photoGrid.firstElementChild);
							};
							reader.readAsDataURL(file);
						}
					}
					this.value = ''; // 清空 input 值，這樣可以重複選擇相同的檔案
				});
			}

			// 處理照片刪除
			photoGrid.addEventListener('click', function (e) {
				if (e.target.closest('.delete-photo')) {
					const photoItem = e.target.closest('.photo-item');
					if (photoItem) {
						// 找到要刪除的照片在陣列中的索引
						const index = Array.from(photoItem.parentNode.children).indexOf(photoItem);
						// 從 selectedPhotos 陣列中移除該照片
						if (index > -1) {
							selectedPhotos.splice(index - 1, 1); // -1 是因為還有一個 add-photo 按鈕
							console.log("刪除後剩餘照片數量：", selectedPhotos.length);
						}
						photoItem.remove();
					}
				}
			});
		});

		// 重導向到首頁並開啟商家登入彈窗
		function redirectToHomePage() {
			// 儲存一個標記，表示要開啟商家登入彈窗
			sessionStorage.setItem('openRestaurantLogin', 'true');
			// 跳轉到首頁
			window.location.href = 'index.html';
		}
		
// ⬅️ 新增這個全域變數，專門記住用戶選的照片
let selectedPhotos = [];

document.getElementById("photo-upload").addEventListener("change", function(e) {
  // 將新選擇的照片添加到現有的照片列表中
  const newPhotos = Array.from(e.target.files);
  selectedPhotos = selectedPhotos.concat(newPhotos);
  console.log("目前總共選了幾張照片：", selectedPhotos.length);
  console.log("新增的照片：", newPhotos.map(p => p.name).join(", "));
});

// 表單送出
document.getElementById("restaurant-signup-form").addEventListener("submit", async function (e) {
  e.preventDefault(); // 阻止表單預設送出

  const formData = new FormData();

  // 取得單檔：頭像
  const avatarFile = document.getElementById("avatar-upload").files[0];
  if (avatarFile) {
    formData.append("avatar", avatarFile);
  }

  // ✅ 用 selectedPhotos，不要再用 getElementById 抓一次了！
  console.log("送出時的照片數量:", selectedPhotos.length);
  for (let i = 0; i < selectedPhotos.length; i++) {
    formData.append("photos", selectedPhotos[i]);
    console.log("加入照片：", selectedPhotos[i].name);
  }

  // 抓其他欄位
  const jsonData = {
    name: document.getElementById("restaurant-name").value,
    email: document.getElementById("email").value,
    phoneNumber: document.getElementById("phone").value,
    password: document.getElementById("password").value,
    confirmPassword: document.getElementById("confirm-password").value,
    address: document.getElementById("address").value,
    cuisineType: document.getElementById("cuisineType").value,
    businessHours: document.getElementById("business-hours").value
  };

  formData.append("data", new Blob([JSON.stringify(jsonData)], { type: "application/json" }));

  try {
    const response = await fetch("http://localhost:8080/api/merchants/register", {
      method: "POST",
      body: formData
    });

    if (response.ok) {
      const result = await response.text();
      alert("註冊成功！伺服器回應：" + result);
      // 清空照片列表
      selectedPhotos = [];
      // 註冊成功後跳轉至首頁
      window.location.href = 'index.html';
    } else {
      const errorText = await response.text();
      alert("發生錯誤：" + response.status + "\n" + errorText);
    }
  } catch (error) {
    console.error("傳送失敗", error);
    alert("傳送失敗：" + error.message);
  }
});

		// 頁面載入時檢查登入狀態
		document.addEventListener('DOMContentLoaded', function() {
			const isLoggedIn = localStorage.getItem('isLoggedIn');
			const user = JSON.parse(localStorage.getItem('user'));

			if (isLoggedIn === 'true' && user) {
				const loginSection = document.getElementById('loginSection');
				const userSection = document.getElementById('userSection');
				if (loginSection) loginSection.style.display = 'none';
				if (userSection) userSection.style.display = 'flex';

				const userAvatarImg = document.querySelector('#userSection .avatar-img');
				if (userAvatarImg && (user.image_url || user.avatar_url)) {
					userAvatarImg.src = user.image_url || user.avatar_url;
				}
			}

			// 初始化通知服務
			if (window.NotificationService && typeof window.NotificationService.initialize === 'function') {
				window.NotificationService.initialize();
			}
		});

		// 登出功能
		function logout() {
			// 清除使用者登入資訊
			localStorage.removeItem('user');
			localStorage.removeItem('isLoggedIn');
			localStorage.removeItem('userId');
			localStorage.removeItem('token');

			// 切換 UI 狀態
			const loginSection = document.getElementById('loginSection');
			const userSection = document.getElementById('userSection');
			if (loginSection) loginSection.style.display = 'flex';
			if (userSection) userSection.style.display = 'none';

			alert('您已成功登出！');
			// 重新載入頁面以確保狀態完全更新
			window.location.reload();
		}

		// 商家登入彈窗功能
		function openRestaurantLoginModal() {
			// 重導向到首頁並開啟商家登入彈窗
			sessionStorage.setItem('openRestaurantLogin', 'true');
			window.location.href = 'index.html';
		}

		// 社群登入功能
		function socialLogin(type) {
			alert('使用 ' + type + ' 登入 (僅前端示意)');
			const loginModal = document.getElementById('loginModal');
			if (loginModal) loginModal.style.display = 'none';
		}
	</script>
	<script src="js/config.js"></script>
	<script src="js/toast.js"></script>
	<script src="js/notificationService.js"></script>
	<script src="js/login.js"></script>
	<script>
		const hamburger = document.querySelector('.hamburger');
		const navRight = document.querySelector('.navbar-right');
		const hamburgerIcon = hamburger.querySelector('i');

		hamburger.addEventListener('click', () => {
			navRight.classList.toggle('active');
			hamburgerIcon.classList.toggle('fa-bars');
			hamburgerIcon.classList.toggle('fa-xmark');
		});
	</script>
</body>
