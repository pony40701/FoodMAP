    <style>
    .modal {
        display: none;
        position: fixed;
        z-index: 2000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0,0,0,0.4);
        animation: fadeIn 0.3s;
    }
    .modal-content {
        background-color: #fff;
        margin: 5% auto;
        border-radius: 16px;
        padding: 32px 32px 24px 32px;
        border: 1px solid #ff6b1a;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        animation: slideIn 0.3s;
        position: relative;
    }
    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
    }
    .modal-header h2 {
        font-size: 28px;
        color: #ff6b1a;
        margin: 0;
    }
    .close {
        color: #aaa;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
        transition: color 0.2s;
    }
    .close:hover {
        color: #ff6b1a;
    }
    .modal-body {
        padding: 0;
    }
    .login-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }
    .form-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    .form-group label {
        font-size: 16px;
        color: #333;
        font-weight: 600;
    }
    .form-group input {
        padding: 8px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
        outline: none;
        transition: border 0.2s;
    }
    .form-group input:focus {
        border: 1.5px solid #ff6b1a;
    }
    .btn-primary {
        background: linear-gradient(135deg, #ff8c42 0%, #ff6b1a 100%);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 0;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 8px;
        transition: background 0.3s;
    }
    .btn-primary:hover {
        background: linear-gradient(135deg, #e55a15 0%, #d4500f 100%);
    }
    .form-footer {
        margin-top: 12px;
        text-align: center;
    }
    .form-footer a {
        color: #ff6b1a;
        text-decoration: none;
        margin: 0 4px;
        font-size: 15px;
        transition: color 0.2s;
    }
    .form-footer a:hover {
        color: #e55a15;
    }
    .social-login {
        margin-top: 18px;
        text-align: center;
    }
    .social-login p {
        margin-bottom: 10px;
        color: #888;
        font-size: 15px;
        position: relative;
    }
    .social-buttons {
        display: flex;
        justify-content: center;
        gap: 12px;
    }
    .social-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        border: none;
        border-radius: 6px;
        padding: 8px 16px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        background: #f5f5f5;
        color: #333;
        transition: background 0.2s, color 0.2s;
    }
    .social-btn.google { color: #db4437; }
    .social-btn.facebook { color: #1877f3; }
    .social-btn.line { color: #00c300; }
    .social-btn:hover {
        background: #eee;
    }
    @keyframes fadeIn {
        from { opacity: 0; } to { opacity: 1; }
    }
    @keyframes slideIn {
        from { transform: translateY(-40px); opacity: 0; } to { transform: translateY(0); opacity: 1; }
    }
    @media (max-width: 480px) {
        .modal-content { padding: 18px 6px 12px 6px; }
        .modal-header h2 { font-size: 22px; }
    }
    
    /* 登入和用戶區塊樣式 */
    .login-section,
    .user-section {
        display: flex;
        align-items: center;
    }
    
    /* 商家頭像樣式 */
    .user-avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        overflow: visible;
        cursor: pointer;
        border: 2px solid #ff6b1a;
        transition: all 0.3s ease;
        position: relative;
        z-index: 1001;
    }
    
    .user-avatar:hover {
        transform: scale(1.1);
        box-shadow: 0 0 15px rgba(255, 107, 26, 0.4);
    }
    
    .avatar-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
    }
    
    /* 頭像下拉選單樣式 */
    .avatar-dropdown {
        position: absolute;
        top: calc(100% + 10px);
        right: 0;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 107, 26, 0.2);
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        min-width: 200px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-10px);
        transition: all 0.3s ease;
        z-index: 1002;
    }
    
    .user-avatar:hover .avatar-dropdown {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
    }
    
    .avatar-dropdown .dropdown-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        color: #ff6b1a;
        text-decoration: none;
        font-size: 16px;
        font-weight: 600;
        transition: all 0.3s ease;
        border-bottom: 1px solid rgba(255, 107, 26, 0.1);
        white-space: nowrap;
    }
    
    .avatar-dropdown .dropdown-item:last-child {
        border-bottom: none;
    }
    
    .avatar-dropdown .dropdown-item i {
        font-size: 18px;
        width: 20px;
        text-align: center;
    }
    
    .avatar-dropdown .dropdown-item:hover {
        background: rgba(255, 107, 26, 0.1);
        color: #ff8c42;
    }
    
    /* 下拉選單分隔線 */
    .dropdown-divider {
        height: 1px;
        background: rgba(255, 107, 26, 0.1);
        margin: 8px 0;
    }
    
    /* 登出選項樣式 */
    .logout-item {
        color: #ff4757 !important;
    }
    
    .logout-item:hover {
        background: rgba(255, 71, 87, 0.1) !important;
        color: #ff6b81 !important;
    }
    
    .logout-item i {
        color: inherit;
    }
    
    /* 響應式設計 */
    @media (max-width: 768px) {
        .avatar-dropdown {
            position: fixed;
            top: auto;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            border-radius: 12px 12px 0 0;
            transform: translateY(100%);
        }
        
        .user-avatar:hover .avatar-dropdown {
            transform: translateY(0);
        }
        
        .avatar-dropdown .dropdown-item {
            padding: 16px;
            font-size: 18px;
        }
        
        .avatar-dropdown .dropdown-item i {
            font-size: 20px;
        }
    }
    
    @media (max-width: 480px) {
        .avatar-dropdown .dropdown-item {
            padding: 14px;
            font-size: 16px;
        }
        
        .avatar-dropdown .dropdown-item i {
            font-size: 18px;
        }
    }
    </style>

    <script>
        // 處理寫食記按鈕點擊
        function handleWriteReview() {
            // 檢查是否已登入（這裡需要根據您的登入狀態管理方式來實現）
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            
            if (!isLoggedIn) {
                // 顯示請先登入的 alert 訊息
                alert('請先登入會員');
                // 顯示登入彈跳視窗
                document.getElementById('loginModal').style.display = 'block';
                // 登入成功後的回調函數 - 只在用戶確實要寫食記時才跳轉
                window.onLoginSuccess = function() {
                    window.location.href = 'blogPost.html';
                };
            } else {
                // 已登入，直接跳轉到寫食記頁面
                window.location.href = 'blogPost.html';
            }
        }

        // 商家登入彈窗相關函數
        function openRestaurantLoginModal() {
            document.getElementById('restaurantLoginModal').style.display = 'block';
        }

        function closeRestaurantLoginModal() {
            document.getElementById('restaurantLoginModal').style.display = 'none';
        }

        // 初始化登入模態框
        document.addEventListener('DOMContentLoaded', function() {
            // 檢查是否需要自動開啟商家登入彈窗
            if (sessionStorage.getItem('openRestaurantLogin') === 'true') {
                sessionStorage.removeItem('openRestaurantLogin');
                openRestaurantLoginModal();
            }
            const loginModal = document.getElementById('loginModal');
            if (loginModal) {
                // 關閉按鈕事件
                const closeBtn = loginModal.querySelector('.close');
                if (closeBtn) {
                    closeBtn.onclick = function() {
                        loginModal.style.display = 'none';
                    };
                }
            }

            // 初始化商家登入模態框
            const restaurantLoginModal = document.getElementById('restaurantLoginModal');
            if (restaurantLoginModal) {
                // 關閉按鈕事件已在 HTML 中設置 onclick
                
                // 表單提交事件
                const restaurantLoginForm = document.getElementById('restaurantLoginForm');
                if (restaurantLoginForm) {
                    restaurantLoginForm.addEventListener('submit', function(e) {
                        e.preventDefault();
                        
                        const email = document.getElementById('restaurant-email').value;
                        const password = document.getElementById('restaurant-password').value;
                        const remember = document.getElementById('restaurant-remember').checked;
                        
                        // 這裡可以添加實際的登入驗證邏輯
                        console.log('商家登入:', { email, password, remember });
                        
                        // 模擬登入成功，跳轉到商家後台
                        alert('登入成功！');
                        closeRestaurantLoginModal();
                        // 跳轉到商家後台主頁
                        window.location.href = 'restaurant.html';
                    });
                }
            }
            
            // 初始化餐廳詳細資訊彈窗
            const restaurantModal = document.getElementById('restaurantModal');
            if (restaurantModal) {
                // 關閉按鈕事件
                const closeBtn = restaurantModal.querySelector('.restaurant-modal-close');
                if (closeBtn) {
                    closeBtn.onclick = function() {
                        closeRestaurantModal();
                    };
                }
            }
            
            // 點擊模態框外部關閉
            window.onclick = function(event) {
                if (event.target === loginModal) {
                    loginModal.style.display = 'none';
                }
                if (event.target === restaurantModal) {
                    closeRestaurantModal();
                }
                const restaurantLoginModal = document.getElementById('restaurantLoginModal');
                if (event.target === restaurantLoginModal) {
                    closeRestaurantLoginModal();
                }
            };
        });
    </script>

    const favoritesModule = new FavoritesModule();
    favoritesModule.loadFavorites && favoritesModule.loadFavorites();
