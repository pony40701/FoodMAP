<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美食地圖FoodMAP</title>
    <!-- 防止 favicon.ico 404 錯誤 -->
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/food-categories.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/favoritesStyle.css">
    <link rel="stylesheet" href="ranking/ranking.css">
    <link rel="stylesheet" href="css/food-types.css">
    <!-- 添加 Google Maps API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAqANvNvM5qZb9I_nkoMPJz_yjhvYKlKD0&libraries=places&callback=initMap" async defer></script>
    <style>
    .modal {
        display: none;
        position: fixed;
        z-index: 2000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0,0,0,0.4);
        animation: fadeIn 0.3s;
    }
    .modal-content {
        background-color: #fff;
        margin: 5% auto;
        border-radius: 16px;
        padding: 32px 32px 24px 32px;
        border: 1px solid #ff6b1a;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        animation: slideIn 0.3s;
        position: relative;
    }
    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
    }
    .modal-header h2 {
        font-size: 28px;
        color: #ff6b1a;
        margin: 0;
    }
    .close {
        color: #aaa;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
        transition: color 0.2s;
    }
    .close:hover {
        color: #ff6b1a;
    }
    .modal-body {
        padding: 0;
    }
    .login-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }
    .form-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
    .form-group label {
        font-size: 16px;
        color: #333;
        font-weight: 600;
    }
    .form-group input {
        padding: 8px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
        outline: none;
        transition: border 0.2s;
    }
    .form-group input:focus {
        border: 1.5px solid #ff6b1a;
    }
    .btn-primary {
        background: linear-gradient(135deg, #ff8c42 0%, #ff6b1a 100%);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 0;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 8px;
        transition: background 0.3s;
    }
    .btn-primary:hover {
        background: linear-gradient(135deg, #e55a15 0%, #d4500f 100%);
    }
    .form-footer {
        margin-top: 12px;
        text-align: center;
    }
    .form-footer a {
        color: #ff6b1a;
        text-decoration: none;
        margin: 0 4px;
        font-size: 15px;
        transition: color 0.2s;
    }
    .form-footer a:hover {
        color: #e55a15;
    }
    .social-login {
        margin-top: 18px;
        text-align: center;
    }
    .social-login p {
        margin-bottom: 10px;
        color: #888;
        font-size: 15px;
        position: relative;
    }
    .social-buttons {
        display: flex;
        justify-content: center;
        gap: 12px;
    }
    .social-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        border: none;
        border-radius: 6px;
        padding: 8px 16px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        background: #f5f5f5;
        color: #333;
        transition: background 0.2s, color 0.2s;
    }
    .social-btn.google { color: #db4437; }
    .social-btn.facebook { color: #1877f3; }
    .social-btn.line { color: #00c300; }
    .social-btn:hover {
        background: #eee;
    }
    @keyframes fadeIn {
        from { opacity: 0; } to { opacity: 1; }
    }
    @keyframes slideIn {
        from { transform: translateY(-40px); opacity: 0; } to { transform: translateY(0); opacity: 1; }
    }
    @media (max-width: 480px) {
        .modal-content { padding: 18px 6px 12px 6px; }
        .modal-header h2 { font-size: 22px; }
    }
    </style>
</head>
<body>
    <!-- 登入彈跳視窗 -->
    <div id="loginModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>登入</h2>
          <span class="close">&times;</span>
        </div>
        <div class="modal-body">
          <form id="loginForm" class="login-form">
            <div class="form-group">
              <label for="email">電子郵件</label>
              <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
              <label for="password">密碼</label>
              <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn-primary">登入</button>
          </form>
          <div class="form-footer">
            <a href="userForgotPassword.html">忘記密碼？</a> | <a href="userRegister.html">註冊新帳號</a>
          </div>
          <div class="social-login">
            <p>或使用以下方式登入</p>
            <div class="social-buttons">
              <button class="social-btn google" onclick="socialLogin('google')">
                <i class="fab fa-google"></i> Google
              </button>
              <button class="social-btn facebook" onclick="socialLogin('facebook')">
                <i class="fab fa-facebook-f"></i> Facebook
              </button>
              <button class="social-btn line" onclick="socialLogin('line')">
                <i class="fab fa-line"></i> Line
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="navbar">
        <div class="navbar-left">
            <span class="logo-text">食力派ChowCrew</span>
        </div>
        <div class="search-section">
            <div class="search-bar">
                <div class="input-container">
                    <span class="input-icon">🍴</span>
                    <input class="search-input" placeholder="找美食" />
                </div>

                <div class="search-divider"></div>
                <div class="input-container">
                    <span class="input-icon">📍</span>
                    <input class="search-input" placeholder="選擇地點" />
                </div>
                <!-- 搜尋按鈕 -->
                <button class="search-btn">
                    <img src="images/search.png" alt="search" width="26" height="26" />
                </button>
            </div>
        </div>
        <div class="navbar-right">
            <div class="dropdown">
                <a href="#" class="nav-link dropdown-toggle">商家專用</a>
                <div class="dropdown-content">
                    <a href="#" class="dropdown-item">商家註冊</a>
                    <a href="#" class="dropdown-item">商家登入</a>
                </div>
            </div>
            <a href="ranking/ranking.html" class="nav-link">排行榜</a>
            <div class="dropdown">
                <a href="#" class="nav-link dropdown-toggle">食評</a>
                <div class="dropdown-content">
                    <a href="#" class="dropdown-item">寫評論</a>
                    <a href="#" class="dropdown-item">寫食記</a>
                </div>
            </div>
            <button class="btn-login">登入</button>
        </div>
    </div>
    <!-- 輪播圖區域 -->
    <div class="carousel-container">
        <!-- Slogan 覆蓋層 -->
        <div class="carousel-slogan">
            <p>發現美食 分享感動</p>
        </div>

        <div class="carousel-wrapper">
            <div class="carousel-slide">
                <img src="images/carousel1.jpg" alt="美食圖片1">
            </div>
            <div class="carousel-slide">
                <img src="images/carousel2.jpg" alt="美食圖片2">
            </div>
            <div class="carousel-slide">
                <img src="images/carousel3.jpg" alt="美食圖片3">
            </div>
        </div>
        <!-- 輪播圖控制按鈕 -->
        <button class="carousel-button prev">&#10094;</button>
        <button class="carousel-button next">&#10095;</button>
        <!-- 輪播圖指示點 -->
        <div class="carousel-dots">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>
    <!-- 美食類型區塊 -->
    <section class="food-types-section">
      <h2>熱門美食類型</h2>
      <div class="food-types">
        <div class="food-type-item" onclick="searchByType('restaurant', '中式')">
          <div class="emoji-circle">
            <img src="images/rice1.png" alt="中式料理" style="width: 50px; height: 50px; object-fit: contain;" />
          </div>
          <span>中式</span>
        </div>
        <div class="food-type-item" onclick="searchByType('restaurant', '燒烤')">
          <div class="emoji-circle">
            <img src="images/bbq1.png" alt="燒烤" style="width: 50px; height: 50px; object-fit: contain;" />
          </div>
          <span>燒烤</span>
        </div>
        <div class="food-type-item" onclick="searchByType('restaurant', '火鍋')">
          <div class="emoji-circle">
            <img src="images/hotpot.png" alt="火鍋" style="width: 50px; height: 50px; object-fit: contain;" />
          </div>
          <span>火鍋</span>
        </div>
        <div class="food-type-item" onclick="searchByType('restaurant', '日式')">
          <div class="emoji-circle">
            <img src="images/sushi1.png" alt="日式料理" style="width: 50px; height: 50px; object-fit: contain;" />
          </div>
          <span>日式</span>
        </div>
        <div class="food-type-item" onclick="searchByType('restaurant', '美式')">
          <div class="emoji-circle">
            <img src="images/hamburger.png" alt="美式" style="width: 50px; height: 50px; object-fit: contain;" />
          </div>
          <span>美式</span>
        </div>
        <div class="food-type-item" onclick="searchByType('restaurant', '義式')">
          <div class="emoji-circle">
            <img src="images/pasta.png" alt="義式" style="width: 50px; height: 50px; object-fit: contain;" />
          </div>
          <span>義式</span>
        </div>
        <div class="food-type-item" onclick="searchByType('restaurant', '牛排')">
          <div class="emoji-circle">
            <img src="images/steak.png" alt="牛排" style="width: 50px; height: 50px; object-fit: contain;" />
          </div>
          <span>牛排</span>
        </div>
        <div class="food-type-item" onclick="searchByType('restaurant', '素食')">
          <div class="emoji-circle">
            <img src="images/vegan1.png" alt="素食" style="width: 50px; height: 50px; object-fit: contain;" />
          </div>
          <span>素食</span>
        </div>
        <div class="food-type-item" onclick="showMoreCategories()">
          <div class="emoji-circle">
            <img src="images/more.png" alt="更多" style="width: 50px; height: 50px; object-fit: contain;" />
          </div>
          <span>更多...</span>
        </div>
      </div>
    </section>

    <!-- 餐廳資訊區塊 -->
    <section class="restaurants-section">
        <h3 id="results-title">推薦餐廳</h3>
        <div class="restaurants-grid" id="restaurants-container">
            <!-- 餐廳卡片將由JavaScript動態生成 -->
        </div>
    </section>

    <!-- 地圖容器 -->
    <div id="map" style="height: 400px; margin: 20px auto; max-width: 1200px; border-radius: 12px; overflow: hidden;"></div>

    <script src="js/main.js"></script>
    <script src="ranking/ranking.js"></script>
    <script>
        // 處理寫食記按鈕點擊
        function handleWriteReview() {
            // 檢查是否已登入（這裡需要根據您的登入狀態管理方式來實現）
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            
            if (!isLoggedIn) {
                // 顯示登入彈跳視窗
                document.getElementById('loginModal').style.display = 'block';
                // 登入成功後的回調函數
                window.onLoginSuccess = function() {
                    window.location.href = 'blogPost.html';
                };
            } else {
                // 已登入，直接跳轉到寫食記頁面
                window.location.href = 'blogPost.html';
            }
        }

        // 初始化登入模態框
        document.addEventListener('DOMContentLoaded', function() {
            const loginModal = document.getElementById('loginModal');
            if (loginModal) {
                // 關閉按鈕事件
                const closeBtn = loginModal.querySelector('.close');
                if (closeBtn) {
                    closeBtn.onclick = function() {
                        loginModal.style.display = 'none';
                    };
                }

                // 點擊模態框外部關閉
                window.onclick = function(event) {
                    if (event.target === loginModal) {
                        loginModal.style.display = 'none';
                    }
                };
            }
        });
    </script>
    <script type="module">
    import FavoritesModule from './js/favoritesModule.js';
    const favoritesModule = new FavoritesModule();
    favoritesModule.loadFavorites && favoritesModule.loadFavorites();
    </script>
</body>
</html>
