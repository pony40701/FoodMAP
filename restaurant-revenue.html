<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>營收管理 - 食力派ChowCrew</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="css/restaurant-revenue.css" />
</head>

<body>
    <!-- 導覽列 -->
    <nav class="navbar">
        <div class="navbar-left">
            <a href="index.html" class="logo-text">食力派ChowCrew</a>
        </div>
        <div class="navbar-right">
            <div class="user-avatar">
                <img src="images/TEST.jpg" alt="商家頭像" class="avatar-img">
                <div class="avatar-dropdown">
                    <a href="restaurant.html" class="dropdown-item">
                        <i class="fas fa-store"></i>
                        <span>商家資料</span>
                    </a>
                    <a href="restaurant-stock.html" class="dropdown-item">
                        <i class="fas fa-boxes"></i>
                        <span>庫存管理</span>
                    </a>
                    <a href="restaurant-revenue.html" class="dropdown-item">
                        <i class="fas fa-chart-line"></i>
                        <span>營收管理</span>
                    </a>
                    <a href="restaurant-comment.html" class="dropdown-item">
                        <i class="fas fa-comments"></i>
                        <span>店家評論</span>
                    </a>
                    <div class="dropdown-divider"></div>
                    <a href="index.html" class="dropdown-item logout-item">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>登出</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要內容區域 -->
    <div class="content-section">
        <div class="dashboard-container">
            <!-- 左側選單 -->
            <div class="sidebar">
                <a href="restaurant.html" class="menu-item">
                    <i class="fas fa-store"></i>
                    <span>商家資料</span>
                </a>
                <a href="restaurant-stock.html" class="menu-item">
                    <i class="fas fa-boxes"></i>
                    <span>庫存管理</span>
                </a>
                <a href="restaurant-revenue.html" class="menu-item active">
                    <i class="fas fa-chart-line"></i>
                    <span>營收管理</span>
                </a>
                <a href="restaurant-comment.html" class="menu-item">
                    <i class="fas fa-comments"></i>
                    <span>店家評論</span>
                </a>
            </div>

            <!-- 主要內容區 -->
            <div class="main-content">
                <div class="content-header">
                    <h1>營收管理</h1>
                    <button class="add-revenue-btn" onclick="showAddRevenueModal()">
                        <i class="fas fa-plus"></i>
                        新增營收
                    </button>
                </div>

                <!-- 營收統計卡片 -->
                <div class="revenue-cards">
                    <div class="revenue-card">
                        <div class="card-icon">
                            <i class="fas fa-dollar-sign"></i>
                        </div>
                        <div class="card-content">
                            <h3>本月營收</h3>
                            <p class="amount">$125,000</p>
                            <span class="trend positive">
                                <i class="fas fa-arrow-up"></i>
                                12.5%
                            </span>
                        </div>
                    </div>
                    <div class="revenue-card">
                        <div class="card-icon">
                            <i class="fas fa-shopping-cart"></i>
                        </div>
                        <div class="card-content">
                            <h3>本月訂單數</h3>
                            <p class="amount">1,250</p>
                            <span class="trend positive">
                                <i class="fas fa-arrow-up"></i>
                                8.3%
                            </span>
                        </div>
                    </div>
                    <div class="revenue-card">
                        <div class="card-icon">
                            <i class="fas fa-users"></i>
                        </div>
                        <div class="card-content">
                            <h3>本月顧客數</h3>
                            <p class="amount">850</p>
                            <span class="trend positive">
                                <i class="fas fa-arrow-up"></i>
                                5.2%
                            </span>
                        </div>
                    </div>
                </div>

                <!-- 營收圖表 -->
                <div class="revenue-chart">
                    <div class="chart-header">
                        <h2>營收趨勢</h2>
                        <div class="chart-filters">
                            <select id="time-range">
                                <option value="week">最近一週</option>
                                <option value="month" selected>最近一個月</option>
                                <option value="year">最近一年</option>
                            </select>
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="revenueChart"></canvas>
                    </div>
                </div>

                <!-- 營收記錄表格 -->
                <div class="revenue-table">
                    <div class="table-header">
                        <h2>營收記錄</h2>
                        <div class="table-filters">
                            <input type="date" id="date-filter" class="date-filter">
                            <select id="payment-filter" class="payment-filter">
                                <option value="all">所有支付方式</option>
                                <option value="cash">現金</option>
                                <option value="credit">信用卡</option>
                                <option value="mobile">行動支付</option>
                            </select>
                        </div>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>日期</th>
                                    <th>訂單編號</th>
                                    <th>金額</th>
                                    <th>支付方式</th>
                                    <th>備註</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>2024/03/15</td>
                                    <td>#ORD001</td>
                                    <td>$1,200</td>
                                    <td>信用卡</td>
                                    <td>午餐時段</td>
                                    <td>
                                        <button class="action-btn edit" onclick="editRevenue(1)">
                                            <i class="fas fa-edit"></i>
                                        </button>
                                        <button class="action-btn delete" onclick="deleteRevenue(1)">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </td>
                                </tr>
                                <!-- 更多記錄... -->
                            </tbody>
                        </table>
                    </div>
                    <!-- 分頁控制 -->
                    <div class="pagination">
                        <button class="page-button" disabled>
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <button class="page-button active">1</button>
                        <button class="page-button">2</button>
                        <button class="page-button">3</button>
                        <button class="page-button">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 新增營收彈窗 -->
    <div class="modal" id="addRevenueModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>新增營收</h2>
                <button class="close-btn" onclick="hideAddRevenueModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="addRevenueForm">
                    <div class="form-group">
                        <label>日期</label>
                        <input type="date" id="revenue-date" required>
                    </div>
                    <div class="form-group">
                        <label>金額</label>
                        <input type="number" id="revenue-amount" placeholder="請輸入金額" required>
                    </div>
                    <div class="form-group">
                        <label>支付方式</label>
                        <select id="revenue-payment" required>
                            <option value="cash">現金</option>
                            <option value="credit">信用卡</option>
                            <option value="mobile">行動支付</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>備註</label>
                        <textarea id="revenue-note" placeholder="請輸入備註"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="cancel-btn" onclick="hideAddRevenueModal()">取消</button>
                <button class="submit-btn" onclick="submitRevenue()">確認</button>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/restaurant-revenue.js"></script>
</body>

</html>
