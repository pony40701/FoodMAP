<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測試登入</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            background-color: #ff6b1a;
            color: white;
            border: none;
            cursor: pointer;
            margin-right: 10px;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            min-height: 100px;
        }
    </style>
</head>
<body>
    <h1>測試登入頁面</h1>
    
    <div class="form-group">
        <label for="email">登入電子郵件:</label>
        <input type="email" id="email" value="alice@example.com">
    </div>
    
    <div class="form-group">
        <label for="password">密碼:</label>
        <input type="password" id="password" value="hashedpwd1">
    </div>
    
    <div>
        <button id="loginBtn">登入</button>
        <button id="clearBtn">清除結果</button>
    </div>
    
    <div class="result" id="result">
        <p>登入結果將顯示在這裡</p>
    </div>
    
    <script>
        document.getElementById('loginBtn').addEventListener('click', function() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerHTML = `<p>正在嘗試登入...</p>`;
            
            // API 基礎 URL
            const API_BASE_URL = 'http://localhost:8080/api';
            
            // 請求資料
            const loginData = {
                email: email,
                password: password
            };
            
            console.log('發送登入請求:', API_BASE_URL + '/auth/login');
            console.log('請求數據:', JSON.stringify(loginData));
            
            // 發送 API 請求
            fetch(`${API_BASE_URL}/auth/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(loginData)
            })
            .then(response => {
                console.log('收到回應:', response);
                console.log('回應狀態:', response.status);
                
                resultDiv.innerHTML += `<p>回應狀態: ${response.status}</p>`;
                
                if (!response.ok) {
                    if (response.status === 401) {
                        throw new Error('帳號或密碼錯誤');
                    }
                    throw new Error('登入失敗');
                }
                return response.json();
            })
            .then(data => {
                console.log('登入回應數據:', data);
                resultDiv.innerHTML += `<p>登入回應數據: ${JSON.stringify(data)}</p>`;
                
                if (data.success) {
                    resultDiv.innerHTML += `<p style="color: green">登入成功！</p>`;
                } else {
                    resultDiv.innerHTML += `<p style="color: red">登入失敗: ${data.message}</p>`;
                }
            })
            .catch(error => {
                console.error('登入錯誤:', error);
                resultDiv.innerHTML += `<p style="color: red">錯誤: ${error.message}</p>`;
            });
        });
        
        document.getElementById('clearBtn').addEventListener('click', function() {
            document.getElementById('result').innerHTML = '<p>登入結果將顯示在這裡</p>';
        });
    </script>
</body>
</html>
