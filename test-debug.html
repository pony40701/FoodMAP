<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分類功能測試</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAqANvNvM5qZb9I_nkoMPJz_yjhvYKlKD0&libraries=places&callback=initMap" async defer></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        .test-button { padding: 10px 20px; margin: 5px; background: #ff6b1a; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .test-button:hover { background: #e55a15; }
        #debug-info { background: #f5f5f5; padding: 15px; border-radius: 5px; margin: 10px 0; }
        #restaurants-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin: 20px 0; }
        .restaurant-card { border: 1px solid #ddd; border-radius: 8px; padding: 15px; background: white; }
        .restaurant-image img { width: 100%; height: 200px; object-fit: cover; border-radius: 5px; }
        .rating { background: rgba(0,0,0,0.7); color: white; padding: 2px 6px; border-radius: 3px; font-size: 12px; }
        #map { height: 400px; margin: 20px 0; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>🔧 分類功能測試頁面</h1>
    
    <div class="test-section">
        <h2>📊 系統狀態檢查</h2>
        <button class="test-button" onclick="checkSystemStatus()">檢查系統狀態</button>
        <button class="test-button" onclick="testBasicSearch()">測試基本搜尋</button>
        <button class="test-button" onclick="testDisplayFunction()">測試顯示功能</button>
        <div id="debug-info">等待測試...</div>
    </div>

    <div class="test-section">
        <h2>🍜 分類測試按鈕</h2>
        <button class="test-button" onclick="testCategoryClick('中式')">測試中式</button>
        <button class="test-button" onclick="testCategoryClick('日式')">測試日式</button>
        <button class="test-button" onclick="testCategoryClick('燒烤')">測試燒烤</button>
        <button class="test-button" onclick="testCategoryClick('火鍋')">測試火鍋</button>
    </div>

    <div class="test-section">
        <h2>📍 地圖容器</h2>
        <div id="map"></div>
    </div>

    <div class="test-section">
        <h2>🍽️ 餐廳結果</h2>
        <h3 id="results-title">等待搜尋結果...</h3>
        <div id="restaurants-container"></div>
    </div>

    <script src="js/main.js"></script>
    <script>
        // 額外的測試函數
        function checkSystemStatus() {
            const debug = document.getElementById('debug-info');
            const status = {
                mapReady: window.mapReady,
                mapObject: !!map,
                placesService: !!placesService,
                isMapInitialized: isMapInitialized,
                searchByTypeFunction: typeof searchByType,
                restaurantContainer: !!document.getElementById('restaurants-container')
            };
            
            debug.innerHTML = `
                <h4>🔍 系統狀態報告</h4>
                <pre>${JSON.stringify(status, null, 2)}</pre>
                <p><strong>診斷結果：</strong></p>
                ${status.mapReady ? '✅' : '❌'} 地圖準備完成<br>
                ${status.mapObject ? '✅' : '❌'} 地圖對象存在<br>
                ${status.placesService ? '✅' : '❌'} Places Service 存在<br>
                ${status.searchByTypeFunction === 'function' ? '✅' : '❌'} searchByType 函數可用<br>
                ${status.restaurantContainer ? '✅' : '❌'} 餐廳容器存在
            `;
            
            console.log('系統狀態:', status);
        }

        function testCategoryClick(categoryName) {
            console.log(`🧪 測試點擊分類: ${categoryName}`);
            const debug = document.getElementById('debug-info');
            debug.innerHTML = `<h4>🧪 測試分類點擊: ${categoryName}</h4><p>檢查控制台輸出...</p>`;
            
            // 直接調用搜尋函數
            if (typeof searchByType === 'function') {
                console.log('✅ searchByType 函數存在，開始調用...');
                searchByType('restaurant', categoryName);
            } else {
                console.error('❌ searchByType 函數不存在！');
                debug.innerHTML += '<p style="color: red;">❌ searchByType 函數不存在！</p>';
            }
        }

        function testBasicSearch() {
            console.log('🔍 執行基本搜尋測試');
            if (typeof testAPISearch === 'function') {
                testAPISearch();
            } else {
                console.error('testAPISearch 函數不存在');
            }
        }

        function testDisplayFunction() {
            console.log('🖼️ 測試顯示功能');
            if (typeof testRestaurantDisplay === 'function') {
                testRestaurantDisplay();
            } else {
                console.error('testRestaurantDisplay 函數不存在');
            }
        }

        // 頁面載入時自動檢查狀態
        setTimeout(() => {
            checkSystemStatus();
        }, 3000);
    </script>
</body>
</html>
