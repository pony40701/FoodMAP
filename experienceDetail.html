    <script src="js/toast.js"></script>

    <script src="js/loginModal.js"></script> 
    <script>
        // navbar and login modal logic
        window.API_BASE_URL = window.API_BASE_URL || 'http://localhost:8080/api';

        const hamburger = document.querySelector('.hamburger');
        const navRight = document.querySelector('.navbar-right');
        const hamburgerIcon = hamburger.querySelector('i');

        hamburger.addEventListener('click', () => {
            navRight.classList.toggle('active');
            hamburgerIcon.classList.toggle('fa-bars');
            hamburgerIcon.classList.toggle('fa-xmark');
        });

        document.addEventListener('DOMContentLoaded', function() {
            // Check login status
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const user = JSON.parse(localStorage.getItem('user'));

            if (isLoggedIn === 'true' && user) {
                const loginSection = document.getElementById('loginSection');
                const userSection = document.getElementById('userSection');
                if (loginSection) loginSection.style.display = 'none';
                if (userSection) userSection.style.display = 'flex';

                const userAvatarImg = document.querySelector('#userSection .avatar-img');
                if (userAvatarImg && (user.image_url || user.avatar_url)) {
                    userAvatarImg.src = user.image_url || user.avatar_url;
                }
            }
            
            // Login Modal
            const loginModal = document.getElementById('loginModal');
            const loginBtns = document.querySelectorAll('.btn-login');
            const loginClose = loginModal ? loginModal.querySelector('.close') : null;

            loginBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    if (loginModal) loginModal.style.display = 'block';
                });
            });

            if (loginClose) {
                loginClose.addEventListener('click', () => {
                    loginModal.style.display = 'none';
                });
            }

            window.addEventListener('click', (event) => {
                if (event.target === loginModal) {
                    loginModal.style.display = 'none';
                }
            });
        });

        function logout() {
            localStorage.removeItem('user');
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('userId');
            localStorage.removeItem('authToken');
            
            const loginSection = document.getElementById('loginSection');
            const userSection = document.getElementById('userSection');
            if (loginSection) loginSection.style.display = 'flex';
            if (userSection) userSection.style.display = 'none';

            showToast('您已成功登出！');
            setTimeout(() => window.location.reload(), 1000);
        }
    </script>
