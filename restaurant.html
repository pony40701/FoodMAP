<!DOCTYPE html>
<html lang="zh-TW">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>商家資料 - 食力派ChowCrew</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
	<link rel="stylesheet" href="css/restaurant.css" />
</head>

<body>
	<!-- 導覽列 -->
	<nav class="navbar">
		<div class="navbar-left">
			<a href="index.html" class="logo-text">食力派ChowCrew</a>
		</div>
		<div class="navbar-right">
			<div class="user-avatar">
				<img src="images/default-avatar.png" alt="商家頭像" class="avatar-img">
				<div class="avatar-dropdown">
					<a href="restaurant.html" class="dropdown-item">
						<i class="fas fa-store"></i>
						<span>商家資料</span>
					</a>
					<a href="restaurant-menu.html" class="dropdown-item">
						<i class="fas fa-utensils"></i>
						<span>菜單管理</span>
					</a>
					<a href="restaurant-comment.html" class="dropdown-item">
						<i class="fas fa-comments"></i>
						<span>店家評論</span>
					</a>
					<div class="dropdown-divider"></div>
					<a href="index.html" class="dropdown-item logout-item">
						<i class="fas fa-sign-out-alt"></i>
						<span>登出</span>
					</a>
				</div>
			</div>
		</div>
	</nav>

	<!-- 主要內容區域 -->
	<div class="content-section">
		<div class="dashboard-container">
			<!-- 左側選單 -->
			<div class="sidebar">
				<a href="restaurant.html" class="menu-item active">
					<i class="fas fa-store"></i>
					<span>商家資料</span>
				</a>				
				<a href="restaurant-menu.html" class="menu-item">
					<i class="fas fa-utensils"></i>
					<span>菜單管理</span>
				</a>
				<a href="restaurant-comment.html" class="menu-item">
					<i class="fas fa-comments"></i>
					<span>店家評論</span>
				</a>
			</div>

			<!-- 主要內容區 -->
			<div class="main-content">
				<div class="content-header">
					<h1>商家資料</h1>
				</div>

				<div class="restaurant-info">
					<div class="info-section">
						<div class="section-header">
							<h2>基本資料</h2>
							<div class="button-group">
								<button type="button" class="edit-button" onclick="toggleEditMode('basic-info')">
									<i class="fas fa-edit"></i>
									編輯資料
								</button>
								<div class="action-buttons" style="display: none;">
									<button type="button" class="cancel-button" onclick="cancelEdit('basic-info')">
										<i class="fas fa-times"></i>
										取消
									</button>
									<button type="button" class="save-button" onclick="saveChanges('basic-info')">
										<i class="fas fa-save"></i>
										確認
									</button>
								</div>
							</div>
						</div>
						<div class="info-grid" id="basic-info">
							<div class="info-item avatar-item">
								<label>商家頭像</label>
								<div class="avatar-container">
									<img src="images/default-avatar.png" alt="商家頭像" class="profile-avatar">
									<div class="avatar-overlay edit-mode">
										<i class="fas fa-camera"></i>
										<span>更換頭像</span>
									</div>
									<input type="file" id="avatar-upload" accept="image/*" class="avatar-input edit-mode">
								</div>
							</div>
							<div class="info-item">
								<label>餐廳名稱</label>
								<p class="view-mode"></p>
								<input type="text" class="edit-mode" value="">
							</div>
							<div class="info-item">
								<label>電子郵件</label>
								<p class="view-mode"></p>
								<input type="email" class="edit-mode" value="">
							</div>
							<div class="info-item">
								<label>聯絡電話</label>
								<p class="view-mode"></p>
								<input type="tel" class="edit-mode" value="">
							</div>
							<div class="info-item">
								<label>營業地址</label>
								<p class="view-mode"></p>
								<input type="text" class="edit-mode" value="">
							</div>
						</div>
					</div>

					<div class="info-section">
						<div class="section-header">
							<h2>營業資訊</h2>
							<div class="button-group">
								<button type="button" class="edit-button" onclick="toggleEditMode('business-info')">
									<i class="fas fa-edit"></i>
									編輯資料
								</button>
								<div class="action-buttons" style="display: none;">
									<button type="button" class="cancel-button" onclick="cancelEdit('business-info')">
										<i class="fas fa-times"></i>
										取消
									</button>
									<button type="button" class="save-button" onclick="saveChanges('business-info')">
										<i class="fas fa-save"></i>
										確認
									</button>
								</div>
							</div>
						</div>
						<div class="info-grid" id="business-info">
							<div class="info-item">
								<label>營業時間</label>
								<p class="view-mode"></p>
								<input type="text" class="edit-mode" value="">
							</div>
							<div class="info-item">
								<label>餐廳類型</label>
								<p class="view-mode"></p>
								<input type="text" class="edit-mode" value="">
							</div>
							<div class="info-item">
								<label>付款方式</label>
								<p class="view-mode"></p>
								<input type="text" class="edit-mode" value="">
							</div>
						</div>
					</div>

					<div class="info-section">
						<div class="section-header">
							<h2>餐廳資訊</h2>
							<div class="button-group">
								<button type="button" class="edit-button" onclick="toggleEditMode('description-info')">
									<i class="fas fa-edit"></i>
									編輯資料
								</button>
								<div class="action-buttons" style="display: none;">
									<button type="button" class="cancel-button" onclick="cancelEdit('description-info')">
										<i class="fas fa-times"></i>
										取消
									</button>
									<button type="button" class="save-button" onclick="saveChanges('description-info')">
										<i class="fas fa-save"></i>
										確認
									</button>
								</div>
							</div>
						</div>
						<div class="info-grid" id="description-info">
							<div class="info-item">
								<label>餐廳簡介</label>
								<p class="view-mode"></p>
								<input type="text" class="edit-mode" value="">
							</div>
						</div>
					</div>

					<div class="info-section">
						<div class="section-header">
							<h2>餐廳照片</h2>
							<div class="button-group">
								<button type="button" class="edit-button" onclick="toggleEditMode('photo-info')">
									<i class="fas fa-edit"></i>
									編輯資料
								</button>
								<div class="action-buttons" style="display: none;">
									<button type="button" class="cancel-button" onclick="cancelEdit('photo-info')">
										<i class="fas fa-times"></i>
										取消
									</button>
									<button type="button" class="save-button" onclick="saveChanges('photo-info')">
										<i class="fas fa-save"></i>
										確認
									</button>
								</div>
							</div>
						</div>
						<div class="photo-gallery" id="photo-info">
							<div class="photo-grid">
								<!-- 新增照片按鈕 -->
								<div class="photo-item add-photo">
									<input type="file" id="photo-upload" accept="image/*" multiple class="photo-input">
									<div class="add-photo-content">
										<i class="fas fa-plus"></i>
										<span>新增照片</span>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<style>
		.section-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 20px;
		}

		.edit-button {
			background-color: #4CAF50;
			color: white;
			border: none;
			padding: 8px 16px;
			border-radius: 4px;
			cursor: pointer;
			display: flex;
			align-items: center;
			gap: 8px;
		}

		.edit-button:hover {
			background-color: #45a049;
		}

		.edit-buttons {
			display: none;
		}

		.info-section.editing .edit-buttons {
			display: flex;
			gap: 10px;
			margin-top: 20px;
			justify-content: flex-end;
		}

		.cancel-button, .save-button {
			padding: 8px 16px;
			border-radius: 4px;
			cursor: pointer;
			display: flex;
			align-items: center;
			gap: 8px;
		}

		.cancel-button {
			background-color: #f44336;
			color: white;
			border: none;
		}

		.save-button {
			background-color: #4CAF50;
			color: white;
			border: none;
		}

		.photo-item {
			position: relative;
			width: 200px;
			height: 200px;
			margin: 10px;
			border-radius: 8px;
			overflow: hidden;
		}

		.photo-item img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.photo-overlay {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.5);
			display: none;
			justify-content: center;
			align-items: center;
			opacity: 0;
			transition: opacity 0.3s ease;
		}

		.photo-item:hover .photo-overlay {
			opacity: 1;
			display: flex;
		}

		.delete-photo {
			background: #ff4444;
			border: none;
			color: white;
			font-size: 16px;
			cursor: pointer;
			padding: 8px 16px;
			border-radius: 4px;
			display: flex;
			align-items: center;
			gap: 8px;
		}

		.delete-photo:hover {
			background: #cc0000;
		}

		.delete-photo i {
			font-size: 16px;
		}

		.add-photo {
			border: 2px dashed #ccc;
			display: none;
			justify-content: center;
			align-items: center;
			cursor: pointer;
			background-color: #f8f8f8;
		}

		.info-section.editing .add-photo {
			display: flex;
		}

		.add-photo-content {
			text-align: center;
			color: #666;
		}

		.add-photo-content i {
			font-size: 24px;
			margin-bottom: 8px;
		}

		.photo-input {
			display: none;
		}

		.photo-grid {
			display: flex;
			flex-wrap: wrap;
			gap: 20px;
			padding: 20px;
		}

		/* 新增照片按鈕的懸停效果 */
		.add-photo:hover {
			border-color: #4CAF50;
			background-color: #f0f0f0;
		}

		.add-photo:hover .add-photo-content {
			color: #4CAF50;
		}

		.button-group {
			display: flex;
			gap: 10px;
			align-items: center;
		}

		.action-buttons {
			display: flex;
			gap: 10px;
		}

		.edit-button,
		.cancel-button,
		.save-button {
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 8px 16px;
			border-radius: 4px;
			cursor: pointer;
			border: none;
			color: white;
		}

		.edit-button {
			background-color: #4CAF50;
		}

		.cancel-button {
			background-color: #f44336;
		}

		.save-button {
			background-color: #2196F3;
		}

		.edit-button:hover {
			background-color: #45a049;
		}

		.cancel-button:hover {
			background-color: #da190b;
		}

		.save-button:hover {
			background-color: #0b7dda;
		}

		.button-group i {
			margin-right: 4px;
		}
	</style>

	<script src="js/restaurant.js"></script>
</body>

</html>
