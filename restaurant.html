<!DOCTYPE html>
<html lang="zh-TW">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>商家資料 - 食力派ChowCrew</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
	<link rel="stylesheet" href="css/restaurant.css" />
</head>

<body>
	<!-- 導覽列 -->
	<nav class="navbar">
		<div class="navbar-left">
			<a href="index.html" class="logo-text">食力派ChowCrew</a>
		</div>
		<div class="navbar-right">
			<div class="user-avatar">
				<img src="images/TEST.jpg" alt="商家頭像" class="avatar-img">
				<div class="avatar-dropdown">
					<a href="restaurant.html" class="dropdown-item">
						<i class="fas fa-store"></i>
						<span>商家資料</span>
					</a>
					<a href="restaurant-menu.html" class="dropdown-item">
						<i class="fas fa-utensils"></i>
						<span>菜單管理</span>
					</a>
					<a href="restaurant-comment.html" class="dropdown-item">
						<i class="fas fa-comments"></i>
						<span>店家評論</span>
					</a>
					<div class="dropdown-divider"></div>
					<a href="index.html" class="dropdown-item logout-item">
						<i class="fas fa-sign-out-alt"></i>
						<span>登出</span>
					</a>
				</div>
			</div>
		</div>
	</nav>

	<!-- 主要內容區域 -->
	<div class="content-section">
		<div class="dashboard-container">
			<!-- 左側選單 -->
			<div class="sidebar">
				<a href="restaurant.html" class="menu-item active">
					<i class="fas fa-store"></i>
					<span>商家資料</span>
				</a>				
				<a href="restaurant-menu.html" class="menu-item">
					<i class="fas fa-utensils"></i>
					<span>菜單管理</span>
				</a>
				<a href="restaurant-comment.html" class="menu-item">
					<i class="fas fa-comments"></i>
					<span>店家評論</span>
				</a>
			</div>

			<!-- 主要內容區 -->
			<div class="main-content">
				<div class="content-header">
					<h1>商家資料</h1>
				</div>

				<div class="restaurant-info">
					<div class="info-section">
						<div class="section-header">
							<h2>基本資料</h2>
							<button type="button" class="edit-button" onclick="toggleEditMode('basic-info')">
								<i class="fas fa-edit"></i>
								編輯資料
							</button>
						</div>
						<div class="info-grid" id="basic-info">
							<div class="info-item avatar-item">
								<label>商家頭像</label>
								<div class="avatar-container">
									<img src="images/TEST.jpg" alt="商家頭像" class="profile-avatar">
									<div class="avatar-overlay">
										<i class="fas fa-camera"></i>
										<span>更換頭像</span>
									</div>
									<input type="file" id="avatar-upload" accept="image/*" class="avatar-input">
								</div>
							</div>
							<div class="info-item">
								<label>餐廳名稱</label>
								<p class="view-mode">美味餐廳</p>
								<input type="text" class="edit-mode" value="美味餐廳">
							</div>
							<div class="info-item">
								<label>電子郵件</label>
								<p class="view-mode">restaurant@example.com</p>
								<input type="email" class="edit-mode" value="restaurant@example.com">
							</div>
							<div class="info-item">
								<label>聯絡電話</label>
								<p class="view-mode">02-1234-5678</p>
								<input type="tel" class="edit-mode" value="02-1234-5678">
							</div>
							<div class="info-item">
								<label>營業地址</label>
								<p class="view-mode">台北市信義區信義路五段7號</p>
								<input type="text" class="edit-mode" value="台北市信義區信義路五段7號">
							</div>
						</div>
					</div>

					<div class="info-section">
						<div class="section-header">
							<h2>營業資訊</h2>
							<button type="button" class="edit-button" onclick="toggleEditMode('business-info')">
								<i class="fas fa-edit"></i>
								編輯資料
							</button>
						</div>
						<div class="info-grid" id="business-info">
							<div class="info-item">
								<label>營業時間</label>
								<p class="view-mode">週一至週五 11:00-22:00<br>週六至週日 10:00-23:00</p>
								<textarea class="edit-mode">週一至週五 11:00-22:00
                                            週六至週日 10:00-23:00</textarea>
							</div>
							<div class="info-item">
								<label>餐廳類型</label>
								<p class="view-mode">中式料理</p>
								<select class="edit-mode">
									<option value="中式料理">中式料理</option>
									<option value="日式料理">日式料理</option>
									<option value="西式料理">西式料理</option>
									<option value="甜點飲品">甜點飲品</option>
									<option value="其他">其他</option>
								</select>
							</div>
							<div class="info-item">
								<label>付款方式</label>
								<p class="view-mode">現金、信用卡、行動支付</p>
								<input type="text" class="edit-mode" value="現金、信用卡、行動支付">
							</div>
						</div>
					</div>

					<div class="info-section">
						<div class="section-header">
							<h2>餐廳簡介</h2>
							<button type="button" class="edit-button" onclick="toggleEditMode('description-info')">
								<i class="fas fa-edit"></i>
								編輯資料
							</button>
						</div>
						<div class="info-content" id="description-info">
							<p class="view-mode">
								我們是一家專注於提供正宗中式料理的餐廳，使用最新鮮的食材，為顧客帶來最道地的美食體驗。我們的廚師團隊擁有豐富的經驗，致力於為每位顧客提供最優質的用餐體驗。</p>
							<textarea
								class="edit-mode">我們是一家專注於提供正宗中式料理的餐廳，使用最新鮮的食材，為顧客帶來最道地的美食體驗。我們的廚師團隊擁有豐富的經驗，致力於為每位顧客提供最優質的用餐體驗。</textarea>
						</div>
					</div>

					<div class="info-section">
						<div class="section-header">
							<h2>餐廳照片</h2>
							<button type="button" class="edit-button" onclick="toggleEditMode('photo-info')">
								<i class="fas fa-edit"></i>
								編輯資料
							</button>
						</div>
						<div class="photo-gallery" id="photo-info">
							<div class="photo-grid">
								<!-- 預設照片 -->
								<div class="photo-item">
									<img src="images/TEST.jpg" alt="餐廳照片1">
									<div class="photo-overlay">
										<button class="delete-photo"><i class="fas fa-trash"></i></button>
									</div>
								</div>
								<div class="photo-item">
									<img src="images/TEST.jpg" alt="餐廳照片2">
									<div class="photo-overlay">
										<button class="delete-photo"><i class="fas fa-trash"></i></button>
									</div>
								</div>
								<!-- 新增照片按鈕 -->
								<div class="photo-item add-photo">
									<input type="file" id="photo-upload" accept="image/*" multiple class="photo-input">
									<div class="add-photo-content">
										<i class="fas fa-plus"></i>
										<span>新增照片</span>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<style>
		.section-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 20px;
		}

		.edit-button {
			background-color: #4CAF50;
			color: white;
			border: none;
			padding: 8px 16px;
			border-radius: 4px;
			cursor: pointer;
			display: flex;
			align-items: center;
			gap: 8px;
		}

		.edit-button:hover {
			background-color: #45a049;
		}

		.edit-buttons {
			display: none;
		}

		.info-section.editing .edit-buttons {
			display: flex;
			gap: 10px;
			margin-top: 20px;
			justify-content: flex-end;
		}

		.cancel-button, .save-button {
			padding: 8px 16px;
			border-radius: 4px;
			cursor: pointer;
			display: flex;
			align-items: center;
			gap: 8px;
		}

		.cancel-button {
			background-color: #f44336;
			color: white;
			border: none;
		}

		.save-button {
			background-color: #4CAF50;
			color: white;
			border: none;
		}

		.photo-item {
			position: relative;
			width: 200px;
			height: 200px;
			margin: 10px;
			border-radius: 8px;
			overflow: hidden;
		}

		.photo-item img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.photo-overlay {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.5);
			display: none;
			justify-content: center;
			align-items: center;
		}

		.info-section.editing .photo-overlay {
			display: flex;
		}

		.delete-photo {
			background: none;
			border: none;
			color: white;
			font-size: 20px;
			cursor: pointer;
		}

		.add-photo {
			border: 2px dashed #ccc;
			display: none;
			justify-content: center;
			align-items: center;
			cursor: pointer;
			background-color: #f8f8f8;
		}

		.info-section.editing .add-photo {
			display: flex;
		}

		.add-photo-content {
			text-align: center;
			color: #666;
		}

		.add-photo-content i {
			font-size: 24px;
			margin-bottom: 8px;
		}

		.photo-input {
			display: none;
		}

		.photo-grid {
			display: flex;
			flex-wrap: wrap;
			gap: 20px;
			padding: 20px;
		}

		/* 新增照片按鈕的懸停效果 */
		.add-photo:hover {
			border-color: #4CAF50;
			background-color: #f0f0f0;
		}

		.add-photo:hover .add-photo-content {
			color: #4CAF50;
		}
	</style>

	<script>
		function toggleEditMode(sectionId) {
			const section = document.getElementById(sectionId);
			const parentSection = section.closest('.info-section');
			
			// 如果其他區塊正在編輯，先取消它們的編輯狀態
			document.querySelectorAll('.info-section.editing').forEach(section => {
				if (section !== parentSection) {
					section.classList.remove('editing');
				}
			});

			// 切換當前區塊的編輯狀態
			parentSection.classList.toggle('editing');

			// 如果進入編輯模式，添加取消和確認按鈕
			if (parentSection.classList.contains('editing')) {
				const editButtons = document.createElement('div');
				editButtons.className = 'edit-buttons';
				editButtons.innerHTML = `
					<button type="button" class="cancel-button" onclick="cancelEdit('${sectionId}')">
						<i class="fas fa-times"></i>
						取消
					</button>
					<button type="button" class="save-button" onclick="saveEdit('${sectionId}')">
						<i class="fas fa-save"></i>
						確認
					</button>
				`;
				parentSection.appendChild(editButtons);

				// 如果是照片區塊，啟用照片上傳功能
				if (sectionId === 'photo-info') {
					enablePhotoUpload();
				}
			} else {
				// 如果退出編輯模式，移除取消和確認按鈕
				const editButtons = parentSection.querySelector('.edit-buttons');
				if (editButtons) {
					editButtons.remove();
				}
			}
		}

		function cancelEdit(sectionId) {
			const section = document.getElementById(sectionId);
			const parentSection = section.closest('.info-section');
			
			// 重置所有輸入欄位的值
			const inputs = parentSection.querySelectorAll('.edit-mode');
			inputs.forEach(input => {
				if (input.tagName === 'SELECT') {
					input.selectedIndex = 0;
				} else {
					input.value = input.defaultValue;
				}
			});

			// 退出編輯模式
			parentSection.classList.remove('editing');
			const editButtons = parentSection.querySelector('.edit-buttons');
			if (editButtons) {
				editButtons.remove();
			}
		}

		function saveEdit(sectionId) {
			const section = document.getElementById(sectionId);
			const parentSection = section.closest('.info-section');
			
			// 更新顯示的資料
			parentSection.querySelectorAll('.view-mode').forEach((element) => {
				const input = element.nextElementSibling;
				if (input) {
					element.textContent = input.value;
				}
			});

			// 退出編輯模式
			parentSection.classList.remove('editing');
			const editButtons = parentSection.querySelector('.edit-buttons');
			if (editButtons) {
				editButtons.remove();
			}

			// 這裡可以添加儲存到後端的程式碼
			console.log('儲存區塊：', sectionId);
		}

		function enablePhotoUpload() {
			const addPhotoButton = document.querySelector('.add-photo');
			const photoUpload = document.getElementById('photo-upload');
			const photoGrid = document.querySelector('.photo-grid');

			if (addPhotoButton && photoUpload) {
				// 點擊新增照片按鈕時觸發檔案選擇
				addPhotoButton.onclick = function() {
					photoUpload.click();
				};

				// 處理照片上傳
				photoUpload.onchange = function(e) {
					const files = e.target.files;
					for (let file of files) {
						if (file.type.startsWith('image/')) {
							const reader = new FileReader();
							reader.onload = function(e) {
								const photoItem = document.createElement('div');
								photoItem.className = 'photo-item';
								photoItem.innerHTML = `
									<img src="${e.target.result}" alt="餐廳照片">
									<div class="photo-overlay">
										<button class="delete-photo"><i class="fas fa-trash"></i></button>
									</div>
								`;
								// 將新照片插入到新增按鈕之前
								photoGrid.insertBefore(photoItem, photoGrid.lastElementChild);
							};
							reader.readAsDataURL(file);
						}
					}
					// 清空 input 值，這樣可以重複選擇相同的檔案
					this.value = '';
				};
			}

			// 處理照片刪除
			photoGrid.onclick = function(e) {
				if (e.target.closest('.delete-photo')) {
					const photoItem = e.target.closest('.photo-item');
					if (photoItem && !photoItem.classList.contains('add-photo')) {
						photoItem.remove();
					}
				}
			};
		}

		console.log('JavaScript 已載入');
		document.addEventListener('DOMContentLoaded', function () {
			console.log('DOM 已載入完成');

			const editButton = document.getElementById('editButton');
			const cancelButton = document.getElementById('cancelButton');
			const saveButton = document.getElementById('saveButton');
			const restaurantInfo = document.querySelector('.restaurant-info');
			const photoUpload = document.getElementById('photo-upload');
			const photoGrid = document.querySelector('.photo-grid');
			const addPhotoButton = document.querySelector('.add-photo');

			// 點擊新增照片按鈕時觸發檔案選擇
			if (addPhotoButton) {
				addPhotoButton.addEventListener('click', function () {
					photoUpload.click();
				});
			}

			// 處理照片上傳
			if (photoUpload) {
				photoUpload.addEventListener('change', function (e) {
					const files = e.target.files;
					for (let file of files) {
						if (file.type.startsWith('image/')) {
							const reader = new FileReader();
							reader.onload = function (e) {
								const photoItem = document.createElement('div');
								photoItem.className = 'photo-item';
								photoItem.innerHTML = `
                  <img src="${e.target.result}" alt="餐廳照片">
                  <div class="photo-overlay">
                    <button class="delete-photo"><i class="fas fa-trash"></i></button>
                  </div>
                `;
								// 將新照片插入到新增按鈕之前
								photoGrid.insertBefore(photoItem, photoGrid.lastElementChild);
							};
							reader.readAsDataURL(file);
						}
					}
					// 清空 input 值，這樣可以重複選擇相同的檔案
					this.value = '';
				});
			}

			// 處理照片刪除
			photoGrid.addEventListener('click', function (e) {
				if (e.target.closest('.delete-photo')) {
					const photoItem = e.target.closest('.photo-item');
					if (photoItem) {
						photoItem.remove();
					}
				}
			});

			// 進入編輯模式
			if (editButton) {
				editButton.onclick = function (e) {
					console.log('點擊編輯按鈕');
					e.preventDefault();
					if (restaurantInfo) {
						restaurantInfo.classList.add('editing');
						console.log('已進入編輯模式');
					}
				};
			}

			// 取消編輯
			if (cancelButton) {
				cancelButton.onclick = function (e) {
					console.log('點擊取消按鈕');
					e.preventDefault();
					if (restaurantInfo) {
						restaurantInfo.classList.remove('editing');
						// 重置所有輸入欄位的值
						const inputs = document.querySelectorAll('.edit-mode');
						inputs.forEach(input => {
							if (input.tagName === 'SELECT') {
								input.selectedIndex = 0;
							} else {
								input.value = input.defaultValue;
							}
						});
						console.log('已取消編輯');
					}
				};
			}

			// 儲存編輯
			if (saveButton) {
				saveButton.onclick = function (e) {
					console.log('點擊儲存按鈕');
					e.preventDefault();
					if (restaurantInfo) {
						// 收集所有編輯的資料
						const formData = {
							name: document.querySelector('.info-item:nth-child(2) .edit-mode')?.value,
							email: document.querySelector('.info-item:nth-child(3) .edit-mode')?.value,
							phone: document.querySelector('.info-item:nth-child(4) .edit-mode')?.value,
							address: document.querySelector('.info-item:nth-child(5) .edit-mode')?.value,
							businessHours: document.querySelector('.info-item:nth-child(1) .edit-mode')?.value,
							type: document.querySelector('.info-item:nth-child(2) .edit-mode')?.value,
							seats: document.querySelector('.info-item:nth-child(3) .edit-mode')?.value,
							payment: document.querySelector('.info-item:nth-child(4) .edit-mode')?.value,
							description: document.querySelector('.info-content .edit-mode')?.value
						};

						console.log('儲存的資料：', formData);

						// 更新顯示的資料
						document.querySelectorAll('.view-mode').forEach((element) => {
							const input = element.nextElementSibling;
							if (input) {
								element.textContent = input.value;
							}
						});

						// 退出編輯模式
						restaurantInfo.classList.remove('editing');
						console.log('已儲存並退出編輯模式');
					}
				};
			}
		});
	</script>
</body>

</html>
