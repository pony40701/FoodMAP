<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商家登入 - 食力派</title>
    <link rel="stylesheet" href="css/restaurant-login-modal.css">
</head>
<body>
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">商家登入</h5>
                <button type="button" class="btn-close" aria-label="Close" onclick="window.history.back();"></button>
            </div>
            <div class="modal-body">
                <form>
                    <div class="mb-3">
                        <label for="email" class="form-label">電子郵件</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">密碼</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">
                            記住我
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">登入</button>
                </form>
                <div class="text-center mt-3">
                    <a href="#">忘記密碼</a> | <a href="restaurant-signup.html">商家註冊</a>
                </div>
            </div>
        </div>
    </div>
    <script src="js/restaurant-login.js"></script>
</body>
</html>
