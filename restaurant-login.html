<!DOCTYPE html>
<html lang="zh-TW">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>商家登入 - 食力派ChowCrew</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
	<link rel="stylesheet" href="css/restaurant-login.css" />
</head>

<body>
	
	<!-- 主要內容區域 -->
	<div class="content-section">
		<!-- 登入表單容器 -->
		<div class="login-container">
			<div class="login-header">
				<h1>商家登入</h1>
				<p>歡迎回到食力派ChowCrew</p>
			</div>

			<form class="login-form" id="restaurant-login-form">
				<div class="form-group">
					<label for="email">電子郵件</label>
					<div class="input-with-icon">
						<i class="fas fa-envelope"></i>
						<input type="email" id="email" name="email" placeholder="請輸入您的電子郵件" required>
					</div>
				</div>

				<div class="form-group">
					<label for="password">密碼</label>
					<div class="input-with-icon">
						<i class="fas fa-lock"></i>
						<input type="password" id="password" name="password" placeholder="請輸入您的密碼" required>
					</div>
				</div>

				<div class="form-options">
					<label class="remember-me">
						<input type="checkbox" id="remember" name="remember">
						<span>記住我</span>
					</label>
					<a href="#" class="forgot-password">忘記密碼？</a>
				</div>

				<button type="submit" class="login-button">登入</button>

				<div class="register-link">
					還沒有帳號？<a href="restaurant-signup.html">立即註冊</a>
				</div>
			</form>
		</div>
	</div>

	<script src="js/restaurant-login.js"></script>
</body>

</html>
