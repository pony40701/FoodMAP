<!-- 收藏功能視圖模板 -->
<template id="favorites-template">
    <div class="favorites-container">
        <h2>我的收藏</h2>
        <div class="favorites-tabs">
            <button class="tab-btn active" data-tab="stores">收藏店家</button>
            <button class="tab-btn" data-tab="reviews">收藏心得</button>
        </div>

        <div class="favorites-content">
            <!-- 收藏店家標籤內容 -->
            <div id="storesTab" class="tab-content active">
                <!-- 視圖切換按鈕 -->
                <div class="view-toggle">
                    <button id="listViewBtn" class="btn-secondary active">列表視圖</button>
                    <button id="mapViewBtn" class="btn-secondary">地圖視圖</button>
                </div>

                <!-- 列表視圖 -->
                <div id="storesListView" class="stores-grid">
                    <!-- 收藏店家將由 JavaScript 動態載入 -->
                </div>

                <!-- 地圖視圖 -->
                <div id="storesMapView" class="map-container" style="display: none;">
                    <div id="map"></div>
                </div>
            </div>

            <!-- 收藏心得標籤內容 -->
            <div id="reviewsTab" class="tab-content">
                <div class="reviews-grid">
                    <!-- 收藏心得將由 JavaScript 動態載入 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 店家卡片模板 -->
    <template id="store-card-template">
        <div class="store-card" data-place-id="">
            <img src="" alt="" class="store-image">
            <button class="favorite-btn">
                <i class="fas fa-star"></i>
            </button>
            <div class="store-info">
                <h3 class="store-name"></h3>
                <div class="store-rating"></div>
                <p class="store-address"></p>
                <div class="store-status"></div>
            </div>
            <div class="store-actions">
                <button class="btn-secondary view-detail">查看詳情</button>
            </div>
        </div>
    </template>

    <!-- 心得卡片模板 -->
    <template id="review-card-template">
        <div class="review-card" data-review-id="">
            <div class="review-header">
                <img src="" alt="" class="reviewer-avatar">
                <div class="reviewer-info">
                    <span class="reviewer-name"></span>
                    <div class="review-rating"></div>
                </div>
            </div>
            <div class="review-content"></div>
            <div class="review-footer">
                <span class="review-date"></span>
                <button class="favorite-btn">
                    <i class="fas fa-star"></i>
                </button>
            </div>
        </div>
    </template>
</template>
