    <!-- 初始化收藏 UI 和測試按鈕 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化收藏系統
            window.favoriteSystem = new FavoriteSystem();
            
            // 顯示收藏的餐廳
            displayFavorites();
            
            // 設置收藏按鈕事件
            setupFavoriteButtons();
        });
        
        // 顯示收藏的餐廳
        async function displayFavorites() {
            const container = document.getElementById('favorites-container');
            const loadingElement = document.getElementById('loading');
            const noFavoritesElement = document.getElementById('no-favorites');
            
            try {
                // 獲取所有收藏的餐廳ID
                const favorites = window.favoriteSystem.getAllFavorites();
                
                if (Object.keys(favorites).length === 0) {
                    loadingElement.style.display = 'none';
                    noFavoritesElement.style.display = 'block';
                    return;
                }
                
                // 獲取餐廳詳細資料
                const favoriteRestaurants = [];
                
                // 從API獲取所有餐廳資料
                const response = await fetch('http://localhost:8080/api/google-restaurants/all');
                if (!response.ok) {
                    throw new Error(`API回應錯誤: ${response.status} ${response.statusText}`);
                }
                
                const allRestaurants = await response.json();
                
                // 篩選出收藏的餐廳
                for (const placeId in favorites) {
                    const restaurant = allRestaurants.find(r => (r.place_id || r.id) === placeId);
                    if (restaurant) {
                        favoriteRestaurants.push(restaurant);
                    } else {
                        // 如果API中找不到餐廳資料，使用本地儲存的基本資訊
                        favoriteRestaurants.push({
                            place_id: placeId,
                            name: favorites[placeId],
                            rating: 0,
                            user_ratings_total: 0,
                            address: '無詳細資料'
                        });
                    }
                }
                
                // 顯示餐廳卡片
                container.innerHTML = '';
                
                favoriteRestaurants.forEach(restaurant => {
                    const card = createRestaurantCard(restaurant);
                    container.appendChild(card);
                });
                
                // 隱藏載入中
                loadingElement.style.display = 'none';
                
            } catch (error) {
                console.error('獲取收藏餐廳資料失敗:', error);
                loadingElement.style.display = 'none';
                container.innerHTML = `<div class="error-message">獲取收藏餐廳資料失敗: ${error.message}</div>`;
            }
        }
        
        // 創建餐廳卡片
        function createRestaurantCard(restaurant) {
            const card = document.createElement('div');
            card.className = 'restaurant-card';
            
            const restaurantId = restaurant.place_id || restaurant.id;
            
            // 使用API獲取圖片
            const imageUrl = `http://localhost:8080/api/restaurant-images/${restaurantId}/raw`;
            
            card.innerHTML = `
                <div class="restaurant-image">
                    <img src="${imageUrl}" alt="${restaurant.name}" onerror="this.src='images/no-image.jpg'">
                    <button class="favorite-btn active" data-place-id="${restaurantId || ''}" data-name="${(restaurant.name || '').replace(/"/g, '&quot;')}">
                        <i class="fas fa-heart"></i>
                    </button>
                </div>
                <div class="restaurant-info">
                    <h3>${restaurant.name}</h3>
                    <div class="rating">
                        <div class="stars">
                            ${generateStars(restaurant.rating)}
                        </div>
                        <span class="rating-text">${restaurant.rating ? restaurant.rating.toFixed(1) : 'N/A'} (${restaurant.user_ratings_total || 0})</span>
                    </div>
                    <div class="address">
                        <i class="fas fa-map-marker-alt"></i>
                        <span>${restaurant.address}</span>
                    </div>
                    ${restaurant.types ? `
                        <div class="tags">
                            ${restaurant.types.slice(0, 3).map(type => `<span class="tag">${type}</span>`).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
            
            return card;
        }
        
        // 生成星級評分
        function generateStars(rating) {
            if (!rating) return '<i class="far fa-star"></i>'.repeat(5);
            
            const fullStars = Math.floor(rating);
            const halfStar = rating % 1 >= 0.5 ? 1 : 0;
            const emptyStars = 5 - fullStars - halfStar;
            
            return '<i class="fas fa-star"></i>'.repeat(fullStars) +
                   (halfStar ? '<i class="fas fa-star-half-alt"></i>' : '') +
                   '<i class="far fa-star"></i>'.repeat(emptyStars);
        }
        
        // 設置收藏按鈕事件
        function setupFavoriteButtons() {
            document.querySelectorAll('.favorite-btn').forEach(button => {
                button.addEventListener('click', function(e) {
                    e.stopPropagation(); // 阻止事件冒泡
                    
                    const placeId = this.dataset.placeId;
                    const name = this.dataset.name;
                    
                    if (!placeId) {
                        console.error('收藏按鈕缺少 place_id');
                        return;
                    }
                    
                    // 移除收藏
                    window.favoriteSystem.removeFavorite(placeId);
                    
                    // 移除卡片
                    const card = this.closest('.restaurant-card');
                    card.classList.add('removing');
                    
                    setTimeout(() => {
                        card.remove();
                        
                        // 檢查是否還有收藏
                        if (document.querySelectorAll('.restaurant-card').length === 0) {
                            document.getElementById('no-favorites').style.display = 'block';
                        }
                    }, 300);
                });
            });
        }
    </script>
