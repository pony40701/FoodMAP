# 顯示更詳細的錯誤訊息
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=ERROR
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.security=DEBUG

# JPA 設定
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT 設定
jwt.secret=foodMapSecretKey2024ChowCrewApplicationSecureTokenGenerationKey
jwt.expiration=86400000

# Spring Security 設定
spring.security.user.name=admin
spring.security.user.password={noop}Foodmap123@

# 伺服器設定
server.port=8080

# CORS 設定
spring.mvc.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=true
spring.mvc.cors.max-age=3600

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.mvc.static-path-pattern=/uploads/**
spring.resources.static-locations=file:uploads/

spring.output.ansi.enabled=ALWAYS

# Application specific properties
app.api.base-url=http://localhost:8080/api/
app.web.base-url=http://localhost:8080