# 資料庫配置
spring.datasource.url=jdbc:mysql://34.80.228.222:3306/foodmap_shrshengfake?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=testuser
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 配置
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Web 配置
server.port=8080
server.servlet.context-path=/api

# JWT 配置
jwt.secret=foodMapSecretKey2023ForJwtAuthenticationToken
jwt.expiration=86400000

# 跨域配置
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*

# 日誌配置
logging.level.org.springframework=INFO
logging.level.com.foodmap=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE 