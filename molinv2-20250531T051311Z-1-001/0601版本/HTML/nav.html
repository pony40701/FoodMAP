<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食力派ChowCrew - 美食地圖</title>
    <link rel="stylesheet" href="/CSS/nav.css">
</head>
<body>
    <div class="navbar">
        <div class="navbar-left">
            <span class="logo-text">食力派ChowCrew</span>
        </div>
        <div class="search-section">
            <div class="search-bar">
                <div class="input-container">
                    <span class="input-icon">🍴</span>
                    <input class="search-input" placeholder="找美食" />
                </div>
              
                <div class="search-divider"></div>
                <div class="input-container">
                    <span class="input-icon">📍</span>
                    <input class="search-input" placeholder="選擇地點" />
                </div>
                <!-- 搜尋按鈕 -->
                <button class="search-btn">
                    <img src="/IMAGE/search.png" alt="search" width="26" height="26" />
                </button>
            </div>
        </div>
        <div class="navbar-right">
            <a href="storeLogin.html" class="nav-link" id="storeLink">商家專用</a>
            <a href="ranking.html" class="nav-link">排行榜</a>
            <a href="foodReviewEdit.html" class="nav-link">寫評論</a>
            <button class="btn-login" id="loginBtn">登入</button>
        </div>
    </div>

    <div id="login-modal-placeholder"></div>
    <script src="/JS/loginModal.js"></script>
    <script>
      fetch('/HTML/loginModal.html').then(r=>r.text()).then(html=>{
        document.getElementById('login-modal-placeholder').innerHTML = html;
        window.initLoginModal && window.initLoginModal();
      });
    </script>

    <script>
        // 檢查商家登入狀態
        if (localStorage.getItem('isStoreLoggedIn')) {
            document.getElementById('storeLink').href = 'storeDashboard.html';
            document.getElementById('storeLink').textContent = '商家儀表板';
        }

        document.addEventListener('DOMContentLoaded', function() {
            const loginBtn = document.querySelector('.btn-login');
            
            // 檢查登入狀態並更新按鈕
            const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
            if (loginBtn) {
                if (isLoggedIn) {
                    loginBtn.textContent = '會員中心';
                    loginBtn.href = 'userCenter.html';
                } else {
                    loginBtn.textContent = '登入';
                    loginBtn.href = 'userLogin.html';
                }
            }
        });
    </script>
</body>
</html>
