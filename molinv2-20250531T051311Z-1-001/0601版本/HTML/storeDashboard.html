<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商家儀表板 - 美食外送平台</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/storeDashboard.css">
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="dashboard-container">
        <div class="dashboard-sidebar">
            <div class="store-info">
                <h3 id="storeName">商家名稱</h3>
                <p id="storeStatus" class="status-open">營業中</p>
            </div>
            <nav class="dashboard-nav">
                <button class="nav-btn active" data-section="overview">總覽</button>
                <button class="nav-btn" data-section="orders">訂單管理</button>
                <button class="nav-btn" data-section="menu">菜單管理</button>
                <button class="nav-btn" data-section="reviews">評論管理</button>
                <button class="nav-btn" data-section="settings">商家設定</button>
            </nav>
        </div>

        <div class="dashboard-content">
            <!-- 總覽區塊 -->
            <section id="overview" class="dashboard-section active">
                <h2>總覽</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>今日訂單</h3>
                        <p id="todayOrders">0</p>
                    </div>
                    <div class="stat-card">
                        <h3>本月營收</h3>
                        <p id="monthlyRevenue">$0</p>
                    </div>
                    <div class="stat-card">
                        <h3>平均評分</h3>
                        <p id="averageRating">0.0</p>
                    </div>
                    <div class="stat-card">
                        <h3>總評論數</h3>
                        <p id="totalReviews">0</p>
                    </div>
                </div>
                <div class="recent-orders">
                    <h3>最近訂單</h3>
                    <div id="recentOrdersList">
                        <!-- 最近訂單將由 JavaScript 動態載入 -->
                    </div>
                </div>
            </section>

            <!-- 訂單管理區塊 -->
            <section id="orders" class="dashboard-section">
                <h2>訂單管理</h2>
                <div class="orders-filter">
                    <select id="orderStatus">
                        <option value="all">全部訂單</option>
                        <option value="pending">待處理</option>
                        <option value="preparing">準備中</option>
                        <option value="ready">待取餐</option>
                        <option value="completed">已完成</option>
                        <option value="cancelled">已取消</option>
                    </select>
                </div>
                <div id="ordersList">
                    <!-- 訂單列表將由 JavaScript 動態載入 -->
                </div>
            </section>

            <!-- 菜單管理區塊 -->
            <section id="menu" class="dashboard-section">
                <h2>菜單管理</h2>
                <button id="addMenuItem" class="btn-primary">新增餐點</button>
                <div id="menuList">
                    <!-- 菜單列表將由 JavaScript 動態載入 -->
                </div>
            </section>

            <!-- 評論管理區塊 -->
            <section id="reviews" class="dashboard-section">
                <h2>評論管理</h2>
                <div class="reviews-filter">
                    <select id="reviewRating">
                        <option value="all">全部評分</option>
                        <option value="5">5星</option>
                        <option value="4">4星</option>
                        <option value="3">3星</option>
                        <option value="2">2星</option>
                        <option value="1">1星</option>
                    </select>
                </div>
                <div id="reviewsList">
                    <!-- 評論列表將由 JavaScript 動態載入 -->
                </div>
            </section>

            <!-- 商家設定區塊 -->
            <section id="settings" class="dashboard-section">
                <h2>商家設定</h2>
                <form id="storeSettingsForm" class="settings-form">
                    <div class="form-group">
                        <label for="storeName">商家名稱</label>
                        <input type="text" id="storeName" name="storeName" required>
                    </div>
                    <div class="form-group">
                        <label for="storePhone">聯絡電話</label>
                        <input type="tel" id="storePhone" name="storePhone" required>
                    </div>
                    <div class="form-group">
                        <label for="storeAddress">商家地址</label>
                        <input type="text" id="storeAddress" name="storeAddress" required>
                    </div>
                    <div class="form-group">
                        <label for="storeCategory">商家類別</label>
                        <select id="storeCategory" name="storeCategory" required>
                            <option value="restaurant">餐廳</option>
                            <option value="cafe">咖啡廳</option>
                            <option value="dessert">甜點店</option>
                            <option value="fastfood">速食店</option>
                            <option value="other">其他</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="businessHours">營業時間</label>
                        <div class="business-hours">
                            <input type="time" id="openTime" name="openTime" required>
                            <span>至</span>
                            <input type="time" id="closeTime" name="closeTime" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>營業狀態</label>
                        <div class="toggle-switch">
                            <input type="checkbox" id="isOpen" name="isOpen">
                            <label for="isOpen"></label>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">儲存設定</button>
                </form>
            </section>
        </div>
    </div>

    <!-- 新增餐點彈窗 -->
    <div id="addMenuItemModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>新增餐點</h2>
            <form id="addMenuItemForm">
                <div class="form-group">
                    <label for="itemName">餐點名稱</label>
                    <input type="text" id="itemName" name="itemName" required>
                </div>
                <div class="form-group">
                    <label for="itemPrice">價格</label>
                    <input type="number" id="itemPrice" name="itemPrice" min="0" required>
                </div>
                <div class="form-group">
                    <label for="itemDescription">描述</label>
                    <textarea id="itemDescription" name="itemDescription" required></textarea>
                </div>
                <div class="form-group">
                    <label for="itemImage">餐點圖片</label>
                    <input type="file" id="itemImage" name="itemImage" accept="image/*">
                </div>
                <div class="form-group">
                    <label for="itemCategory">分類</label>
                    <input type="text" id="itemCategory" name="itemCategory" required>
                </div>
                <button type="submit" class="btn-primary">新增</button>
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(function(){
            $("#nav-placeholder").load("nav.html");
        });
    </script>
    <script src="../JS/storeDashboard.js"></script>
</body>
</html>
