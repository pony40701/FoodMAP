<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的收藏 - 食力派ChowCrew</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/favorites.css">
    <!-- 添加 Google Maps API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAqANvNvM5qZb9I_nkoMPJz_yjhvYKlKD0" async defer></script>
</head>
<body>
    <div id="nav-placeholder"></div>

    <div class="favorites-container">
        <h2>我的收藏</h2>
        <div class="favorites-tabs">
            <button class="tab-btn active" data-tab="stores">收藏店家</button>
            <button class="tab-btn" data-tab="reviews">收藏心得</button>
        </div>

        <div class="favorites-content">
            <div id="storesTab" class="tab-content active">
                <div class="stores-grid">
                    <!-- 收藏店家將由 JavaScript 動態載入 -->
                </div>
            </div>
            <div id="reviewsTab" class="tab-content">
                <div class="reviews-grid">
                    <!-- 收藏心得將由 JavaScript 動態載入 -->
                </div>
            </div>
        </div>

        <!-- 地圖視圖切換按鈕 -->
        <div class="view-toggle">
            <button id="listViewBtn" class="btn-secondary active">列表視圖</button>
            <button id="mapViewBtn" class="btn-secondary">地圖視圖</button>
        </div>

        <!-- 地圖容器 -->
        <div id="mapContainer" class="map-container" style="display: none;">
            <div id="map"></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(function(){
            $("#nav-placeholder").load("nav.html");
        });
    </script>
    <script src="../JS/favorites.js"></script>
</body>
</html>
