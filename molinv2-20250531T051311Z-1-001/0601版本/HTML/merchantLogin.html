<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商家登入 - 食力派ChowCrew</title>
    <link rel="stylesheet" href="/CSS/merchantLogin.css">
</head>
<body>
    <div class="login-container">
        <h1>商家登入</h1>
        <form id="merchantLoginForm" class="login-form">
            <div class="form-group">
                <label for="email">電子郵件</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">密碼</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <span>記住我</span>
                </label>
                <a href="#" class="forgot-password">忘記密碼？</a>
            </div>
            <button type="submit" class="login-btn">登入</button>
        </form>
        <p class="register-link">還沒有帳號？<a href="/HTML/merchantRegister.html">立即註冊</a></p>
    </div>
    <script src="/JS/merchantLogin.js"></script>
</body>
</html>
