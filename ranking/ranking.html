<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美食排行榜 - 食力派ChowCrew</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/navforaboutus.css">
    <link rel="stylesheet" href="../CSS/footer.css">
    <link rel="stylesheet" href="./ranking.css">
    <style>
        .title-section {
            text-align: center;
            padding: 35px 0;
            margin-top: 100px;
            margin-bottom: 30px;
            position: relative;
            background-color: #fff;
            box-shadow: 0 2px 15px rgba(255, 107, 26, 0.1);
        }
        .title-section::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, #ff6b1a, #ff8c42);
        }
        .title-section::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, #ff6b1a, #ff8c42);
        }
        .title-section h1 {
            font-size: 2.2em;
            color: #333;
            margin-bottom: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .title-section h1::before,
        .title-section h1::after {
            content: '★';
            color: #ff6b1a;
            font-size: 0.7em;
        }
        .title-section p {
            font-size: 1.1em;
            color: #666;
            position: relative;
            display: inline-block;
            padding: 0 20px;
        }
        .title-section p::before,
        .title-section p::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 30px;
            height: 1px;
            background-color: #ff8c42;
        }
        .title-section p::before {
            left: -20px;
        }
        .title-section p::after {
            right: -20px;
        }
    </style>
</head>
<body>
    <!-- 導航欄 -->
    <div class="navbar">
        <div class="navbar-left">
            <a href="index.html" class="logo-text">食力派ChowCrew</a>
        </div>
        <div class="search-section">
            <div class="search-bar">
                <div class="input-container">
                    <span class="input-icon">🍴</span>
                    <input class="search-input" placeholder="找美食" />
                </div>
                <div class="search-divider"></div>
                <div class="input-container">
                    <span class="input-icon">📍</span>
                    <input class="search-input" placeholder="選擇地點" />
                </div>
                <!-- 搜尋按鈕 -->
                <button class="search-btn">
                    <img src="../images/search.png" alt="search" width="26" height="26" />
                </button>
            </div>
        </div>
        <div class="navbar-right">
            <div class="restaurant-dropdown">
                <a href="../restaurantList.html" class="nav-link dropdown-toggle">
                    <i class="fas fa-utensils"></i>
                    <span>餐廳詳情</span>
                </a>
            </div>
            <div class="restaurant-dropdown">
                <a href="#" class="nav-link dropdown-toggle">排行榜 <i class="fas fa-chevron-down"></i></a>
                <div class="restaurant-dropdown-content">
                    <a href="./ranking.html" class="dropdown-item">
                        <i class="fas fa-trophy"></i>
                        <span>綜合排行</span>
                    </a>
                    <a href="./ranking.html#popular" class="dropdown-item">
                        <i class="fas fa-fire"></i>
                        <span>人氣排行</span>
                    </a>
                    <a href="./ranking.html#rating" class="dropdown-item">
                        <i class="fas fa-star"></i>
                        <span>評分排行</span>
                    </a>
                </div>
            </div>
            <div class="restaurant-dropdown">
                <a href="#" class="nav-link dropdown-toggle">食評 <i class="fas fa-chevron-down"></i></a>
                <div class="restaurant-dropdown-content">
                    <a href="javascript:void(0)" onclick="handleWriteReview()" class="dropdown-item">
                        <i class="fas fa-pen-alt"></i>
                        <span>寫食記</span>
                    </a>
                    <a href="/experienceList.html" class="dropdown-item">
                        <i class="fas fa-book-open"></i>
                        <span>瀏覽心得</span>
                    </a>
                </div>
            </div>
            <div class="restaurant-dropdown">
                <a href="#" class="nav-link dropdown-toggle">商家專用 <i class="fas fa-chevron-down"></i></a>
                <div class="restaurant-dropdown-content">
                    <a href="../restaurant-signup.html" class="dropdown-item">
                        <i class="fas fa-store"></i>
                        <span>商家註冊</span>
                    </a>
                    <a href="#" class="dropdown-item" onclick="openRestaurantLoginModal()">
                        <i class="fas fa-sign-in-alt"></i>
                        <span>商家登入</span>
                    </a>
                </div>
            </div>
            <!-- 未登入狀態 - 顯示登入按鈕 -->
            <div id="loginSection" class="login-section">
                <button class="btn-login">登入</button>
            </div>
            
            <!-- 已登入狀態 - 顯示會員頭像 -->
            <div id="userSection" class="user-section" style="display: none;">
                <div class="user-avatar">
                    <img src="../images/TEST.jpg" alt="會員頭像" class="avatar-img">
                    <div class="avatar-dropdown">
                        <a href="../usercenter.html" class="dropdown-item">
                            <i class="fas fa-tachometer-alt"></i>
                            <span>會員中心</span>
                        </a>
                        <a href="../usercenter.html#favorites" class="dropdown-item">
                            <i class="fas fa-heart"></i>
                            <span>我的收藏</span>
                        </a>
                        <a href="../usercenter.html#reviews" class="dropdown-item">
                            <i class="fas fa-star"></i>
                            <span>我的評論</span>
                        </a>
                        <a href="../usercenter.html#orders" class="dropdown-item">
                            <i class="fas fa-history"></i>
                            <span>瀏覽紀錄</span>
                        </a>
                        <div class="dropdown-divider"></div>
                        <a href="#" class="dropdown-item logout-item" onclick="logout()">
                            <i class="fas fa-sign-out-alt"></i>
                            <span>登出</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 標題區塊 -->
    <div class="title-section">
        <h1>美食排行榜</h1>
        <p>探索城市中最受歡迎的美食餐廳</p>
    </div>

    <div class="container">
        <div class="filter-section">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">綜合排行</button>
                <button class="filter-btn" data-filter="weekly">本周熱門</button>
                <button class="filter-btn" data-filter="new">新店推薦</button>
            </div>
        </div>
        <div class="container two-columns">
            <div class="column google-list">
                <h2 class="list-title">Google 商家檔案</h2>
                <div class="restaurant-list"></div>
            </div>
            <div class="column custom-list">
                <h2 class="list-title">食力派饕客回饋</h2>
                <div class="custom-restaurant-list"></div>
            </div>
        </div>
        <button class="load-more">載入更多</button>
    </div>

    <div class="modal" id="restaurantModal">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <div class="restaurant-detail">
                <!-- 詳細內容將通過 JavaScript 動態載入 -->
            </div>
        </div>
    </div>

    <script src="./ranking.js"></script>
</body>
</html>
