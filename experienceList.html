    <script>
        // 回到頂部按鈕功能
        const backToTopButton = document.getElementById('backToTop');
        
        // 當頁面滾動超過300px時顯示按鈕
        window.onscroll = function() {
            if (document.body.scrollTop > 80 || document.documentElement.scrollTop > 300) {
                backToTopButton.style.display = "block";
            } else {
                backToTopButton.style.display = "none";
            }
        };
        
        // 點擊按鈕回到頂部
        backToTopButton.onclick = function() {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        };
    </script>
    <script src="js/toast.js"></script>
    <script src="js/notificationService.js"></script>
    <script src="js/experienceList.js"></script>
    <script>
        // API 基礎路徑
        window.API_BASE_URL = window.API_BASE_URL || 'http://localhost:8080/api';

        const hamburger = document.querySelector('.hamburger');
        const navRight = document.querySelector('.navbar-right');
        const hamburgerIcon = hamburger.querySelector('i');

        hamburger.addEventListener('click', () => {
            navRight.classList.toggle('active');
            hamburgerIcon.classList.toggle('fa-bars');
            hamburgerIcon.classList.toggle('fa-xmark');
        });

        // 登入彈窗功能
        document.addEventListener('DOMContentLoaded', function() {
            // 新增：頁面載入時檢查登入狀態
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const user = JSON.parse(localStorage.getItem('user'));

            if (isLoggedIn === 'true' && user) {
                const loginSection = document.getElementById('loginSection');
                const userSection = document.getElementById('userSection');
                if (loginSection) loginSection.style.display = 'none';
                if (userSection) userSection.style.display = 'flex';

                const userAvatarImg = document.querySelector('#userSection .avatar-img');
                if (userAvatarImg && (user.image_url || user.avatar_url)) {
                    userAvatarImg.src = user.image_url || user.avatar_url;
                }

                // 初始化通知服務
                if (window.NotificationService && typeof window.NotificationService.initialize === 'function') {
                    window.NotificationService.initialize();
                }
            }
            
            // 會員登入
            const loginModal = document.getElementById('loginModal');
            const loginBtns = document.querySelectorAll('.btn-login');
            const loginClose = loginModal.querySelector('.close');
            // 商家登入
            const restaurantLoginModal = document.getElementById('restaurantLoginModal');
            const restaurantLoginClose = restaurantLoginModal.querySelector('.close');

            // 開啟會員登入
            loginBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    loginModal.style.display = 'block';
                });
            });
            // 關閉會員登入
            if(loginClose) {
                loginClose.addEventListener('click', function() {
                    loginModal.style.display = 'none';
                });
            }
            
            window.addEventListener('click', function(event) {
                if (event.target === loginModal) {
                    loginModal.style.display = 'none';
                }
                if (event.target === restaurantLoginModal) {
                    restaurantLoginModal.style.display = 'none';
                }
            });
            // 開啟商家登入
            document.querySelectorAll('a.dropdown-item').forEach(link => {
                const text = link.querySelector('span');
                if (text && text.textContent.includes('商家登入')) {
                    link.addEventListener('click', function(e) {
                        e.preventDefault();
                        restaurantLoginModal.style.display = 'block';
                    });
                }
            });
            // 關閉商家登入
            if(restaurantLoginClose){
                restaurantLoginClose.addEventListener('click', function() {
                    restaurantLoginModal.style.display = 'none';
                });
            }

            // 會員登入表單送出（呼叫後端 API）
            const userLoginForm = document.getElementById('loginForm');
            if (userLoginForm) {
                userLoginForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    const email = userLoginForm.querySelector('#email').value;
                    const password = userLoginForm.querySelector('#password').value;
                    try {
                        const response = await fetch(`${window.API_BASE_URL}/auth/login`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Accept': 'application/json'
                            },
                            body: JSON.stringify({ email, password })
                        });
                        const data = await response.json();
                        if (response.ok) {
                            // 儲存用戶資料
                            localStorage.setItem('user', JSON.stringify(data));
                            localStorage.setItem('isLoggedIn', 'true');
                            localStorage.setItem('userId', data.id);
                            localStorage.setItem('authToken', data.token);
                            // 顯示會員頭像
                            const loginSection = document.getElementById('loginSection');
                            const userSection = document.getElementById('userSection');
                            if (loginSection) loginSection.style.display = 'none';
                            if (userSection) userSection.style.display = 'flex';
                            // 更新頭像
                            const userAvatarImg = document.querySelector('.avatar-img');
                            if (userAvatarImg && (data.image_url || data.avatar_url)) {
                                userAvatarImg.src = data.image_url || data.avatar_url;
                            }
                            loginModal.style.display = 'none';
                            showToast('登入成功！');
                            setTimeout(() => location.reload(), 1000); 
                        } else {
                            alert(data.error || data.message || '登入失敗');
                        }
                    } catch (error) {
                        alert('登入失敗，請稍後再試');
                    }
                });
            }

            // 商家登入表單送出（呼叫後端 API）
            const restaurantLoginForm = document.getElementById('restaurantLoginForm');
            if (restaurantLoginForm) {
                restaurantLoginForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    const email = document.getElementById('restaurant-email').value;
                    const password = document.getElementById('restaurant-password').value;
                    try {
                        const response = await fetch(`${window.API_BASE_URL}/merchants/login`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({ email, password })
                        });
                        if (response.ok) {
                            const result = await response.json();
                            localStorage.setItem('merchantToken', result.token);
                            localStorage.setItem('merchantEmail', result.email);
                            localStorage.setItem('restaurantId', result.restaurantId);
                            showToast('商家登入成功！');
                            restaurantLoginModal.style.display = 'none';
                            setTimeout(() => {
                                window.location.href = 'restaurant.html';
                            }, 1000);
                        } else {
                            const errorData = await response.json();
                            alert(errorData.message || '商家登入失敗');
                        }
                    } catch (error) {
                        alert('商家登入失敗，請稍後再試');
                    }
                });
            }

            // 社群登入按鈕（僅示意）
            window.socialLogin = function(type) {
                alert('使用 ' + type + ' 登入 (僅前端示意)');
                loginModal.style.display = 'none';
            }
        });

        function logout() {
            // 清除使用者登入資訊
            localStorage.removeItem('user');
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('userId');
            localStorage.removeItem('authToken');

            // 切換 UI 狀態
            const loginSection = document.getElementById('loginSection');
            const userSection = document.getElementById('userSection');
            if (loginSection) loginSection.style.display = 'flex';
            if (userSection) userSection.style.display = 'none';

            showToast('您已成功登出！');
            // 重新載入頁面以確保狀態完全更新
            setTimeout(() => window.location.reload(), 1000);
        }

        // 商家登入彈窗相關函數
        function openRestaurantLoginModal() {
            document.getElementById('restaurantLoginModal').style.display = 'block';
        }
    </script>
</body>
</html>
